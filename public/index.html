<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PR Radar — Brand &amp; Reputation</title>
<meta name="description" content="Daily brand &amp; reputation monitor for Vodafone Egypt — Vodafone, Orange, WE and e&amp; in the Egyptian mobile market, with sentiment, author and coverage spread.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f1f2f5">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PR Radar">
<meta property="og:title" content="PR Radar — Brand &amp; Reputation board">
<meta property="og:description" content="Daily press &amp; media monitor for Vodafone Egypt — coverage, sentiment and share of voice, classified and briefed for the PR &amp; Communications team.">
<meta property="og:image" content="/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/og-card.png">
<style>
  :root{
    --red:#e60000; --red-deep:#b60009; --red-glow:rgba(230,0,0,.28);
    --bg:#f1f2f5; --card:#ffffff; --raise:#f6f7f9;
    --ink:#16191f; --ink-2:#3b434e; --muted:#6c7480; --faint:#9aa2ad; --hair:#e7e9ee; --hair-2:#eef0f3;
    --neg:#e60000; --neg-bg:#fff2f0; --neg-line:#ffd4cf;
    --pos:#0f9d58; --pos-bg:#edfaf1; --pos-line:#c3e9d1;
    --neu:#5b6675; --neu-bg:#f0f3f7; --neu-line:#e0e6ec;
    --amber:#d97706;
    --dot-empty:#dfe3e8; --seg-neu:#d3dae1; --seg-empty:#e7e9ee;
    --topbg:rgba(255,255,255,.82); --barbg:rgba(241,242,245,.9); --markbg:var(--ink); --skel:#e7e9ee; --skel-hi:#f3f5f7;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --mh:92px;   /* two header rows: identity + nav */
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  a{color:var(--red)}
  .wrap{max-width:840px;margin:0 auto;min-height:100vh}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}

  /* ── header ── */
  /* TWO ROWS: identity above, navigation below. One row could not hold the
     wordmark, the attribution, two LABELLED section links and the account
     cluster — .wrap caps at 840px, so the row was over-subscribed at every
     viewport and something always got crushed. Splitting them means nothing
     competes, and the labels can say what they are instead of being bare icons. */
  .top{position:sticky;top:0;z-index:40;height:var(--mh);display:flex;flex-direction:column;justify-content:center;
       background:var(--topbg);backdrop-filter:blur(16px);border-bottom:1px solid var(--hair)}
  .trow{display:flex;align-items:center;gap:11px;padding:0 16px;height:46px}
  .trow.nav{gap:8px;border-top:1px solid var(--hair-2)}
  .mark{position:relative;flex:none;width:34px;height:34px;border-radius:11px;background:var(--markbg);overflow:hidden;
        display:grid;place-items:center}
  .mark .sweep{position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 300deg,rgba(230,0,0,.7) 358deg,#fff 360deg);
               animation:sweep 3.6s linear infinite}
  .mark .glyph{position:relative;font-weight:800;font-size:13px;color:#fff;letter-spacing:-.02em}
  @keyframes sweep{to{transform:rotate(360deg)}}
  /* The title takes its NATURAL width and never shrinks. It used to be the only
     flex:1 child in a row of flex:none ones, so it absorbed every shortfall —
     and because .wrap caps at 840px the row is over-subscribed at EVERY
     viewport, so "PR Radar" rendered as "PR Ra…" on desktop and collapsed to a
     1px "P…" on a phone. Slack and shortfall now land on .account instead,
     whose email is already an ellipsised, expendable string. */
  .ttl{flex:none;min-width:0}
  .ttl .h1{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.05;white-space:nowrap}
  .ttl .sub{font-size:10.5px;line-height:1.2;margin-top:2px;color:var(--faint);font-weight:500;white-space:nowrap}
  .ttl .sub b{color:var(--ink-2);font-weight:700}
  .trends{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:var(--red);
          text-decoration:none;background:#fff;border:1.5px solid var(--red);border-radius:9px;padding:7px 12px;white-space:nowrap;
          box-shadow:0 1px 6px -2px var(--red-glow)}
  .trends:hover{background:var(--red);color:#fff}
  .trends .tic{font-size:12px;line-height:1}
  .trends .tlabel{white-space:nowrap}
  .clock{flex:none;margin-left:auto;text-align:right;background:var(--raise);border:1px solid var(--hair);border-radius:9px;padding:5px 9px}
  .clock .t{font-family:var(--mono);font-size:12px;font-weight:700;line-height:1.1}
  .clock .d{font-family:var(--mono);font-size:8px;color:var(--faint);letter-spacing:.08em}
  /* Takes the slack AND the shortfall: flex:1 pushes the cluster right, and
     min-width:0 lets what's inside it give way first. */
  .account{flex:1 1 auto;display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
  /* The guide "?" and the Admin pill — NAVIGATION, which is why they stay out in
     the row while everything about your own account moved into the menu below. */
  .account .acctlink{cursor:pointer;text-decoration:none;border:1px solid var(--hair);background:var(--raise);
                    color:var(--ink-2);font-size:11px;border-radius:8px;padding:5px 9px;font-weight:600;white-space:nowrap}
  .account .acctlink:hover{border-color:var(--faint)}
  /* 32px, not 28: this is a round icon target with a single "?" in it, and at
     28 it measured 9px WIDE — the glyph's own width, because `display:grid`
     with `place-items:center` sizes to content unless the box is told
     otherwise. flex:none stops the header row shrinking it further. */
  .account .acctlink.guide{flex:none;width:32px;min-width:32px;height:32px;padding:0;border-radius:50%;
        display:grid;place-items:center;font-weight:800;font-size:14px}

  /* ── account menu ──
     Identity, Change password and Sign out used to sit in the header as three
     separate pills, and the row could not hold them: below 560px both the email
     and the PASSWORD link were display:none. So on a phone there was no route to
     the change-password page at all — while the welcome email tells every new
     user to "open Password in the top bar", and in the same breath suggests Add
     to Home Screen. One trigger button holds all three, so the cluster has
     nothing left to shed and the width where it breaks no longer exists. */
  .acct{position:relative;flex:none}
  .acct-btn{cursor:pointer;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--hair);background:var(--raise);
            color:var(--ink-2);font-family:inherit;font-size:11px;font-weight:600;border-radius:8px;padding:5px 9px;white-space:nowrap}
  .acct-btn:hover{border-color:var(--faint)}
  .acct-btn .chev{transition:transform .15s}
  .acct[data-open=true] .acct-btn{border-color:var(--faint);background:var(--card)}
  .acct[data-open=true] .acct-btn .chev{transform:rotate(180deg)}
  /* display:none, not visibility — a closed menu must have NO box, or the
     header's "is anything crushed?" guard measures a panel nobody can see. */
  .acct-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:60;
             min-width:212px;max-width:min(264px,calc(100vw - 24px));
             background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:6px;
             box-shadow:0 14px 40px -12px rgba(16,20,28,.3)}
  .acct[data-open=true] .acct-menu{display:block}
  .acct-menu .who{padding:7px 9px 9px;border-bottom:1px solid var(--hair-2);margin-bottom:5px}
  /* The address WRAPS. Ellipsising it is how you end up showing half an email
     to someone trying to check which account they are signed into. */
  .acct-menu .who .em{font-size:12px;font-weight:700;color:var(--ink);line-height:1.35;overflow-wrap:anywhere}
  .acct-menu .who .rl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
  .acct-item{display:flex;align-items:center;gap:9px;width:100%;box-sizing:border-box;cursor:pointer;text-align:left;
             border:0;background:none;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);
             padding:10px 9px;border-radius:9px;text-decoration:none}
  .acct-item:hover{background:var(--raise);color:var(--ink)}
  .acct-item .ic{flex:none;font-size:13px;line-height:1;width:15px;text-align:center}
  .acct-item.danger{color:var(--red-deep)}
  .acct-item.danger:hover{background:var(--neg-bg)}
  @media (max-width:560px){
    /* The wordmark is the FIRST thing to drop on a phone, not the last.
       .ttl was the only flex:1 child in a row of flex:none ones, so it absorbed
       ALL the overflow: at 390px it measured 1px against 69px of content and
       rendered the product's own name as "P…". Hiding it is deterministic — the
       PR mark beside it already carries the brand — where any width-juggling
       stays hostage to how wide the account cluster happens to be (it grows with
       role and email). Both pills go icon-only TOGETHER: Trends keeping its
       label while Reports had lost its own read as a broken button. */
    /* The nav row has room for both labels at 390px; only the clock goes — the
       account cluster is one button now and sheds nothing. */
    .top .clock{display:none}
    .trow{padding:0 12px;gap:9px}
  }
  /* Viewers are read-only — hide the write controls (pins/hide/votes) entirely. */
  /* Pin / hide / useful / not-useful now live inside the ••• menu, and the
     whole menu is admin-only — the same gate the 🔔 uses. Stricter than the
     old `[data-role="viewer"]` rule, which showed those four for the moment
     before loadMe() resolved. */
  body:not([data-role="admin"]) .more{ display:none }
  /* The alert bell PAGES PEOPLE — admin only, and hidden until the role is
     known so a viewer never sees it flash in and out. */
  body:not([data-role="admin"]) .fb.alert{ display:none }

  /* ── spotlight ── */
  .spotlight{display:none;align-items:center;gap:11px;cursor:pointer;margin:12px 16px 0;color:#fff;
             padding:13px 15px;border-radius:15px;line-height:1.35;font-size:13px;
             background:linear-gradient(120deg,#c2000a,#e60000);box-shadow:0 8px 22px -8px var(--red-glow)}
  .spotlight.on{display:flex;animation:rise .5s both}
  .spotlight .pin{flex:none;position:relative;width:9px;height:9px}
  .spotlight .pin::before,.spotlight .pin::after{content:"";position:absolute;inset:0;border-radius:50%;background:#fff}
  .spotlight .pin::after{animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
  @keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.6);opacity:0}}
  .spotlight .txt{flex:1;min-width:0}
  .spotlight .lab{font-size:9px;font-weight:800;letter-spacing:.16em;opacity:.85;text-transform:uppercase}
  .spotlight b{font-weight:800}
  .spotlight .go{flex:none;font-size:11px;font-weight:700;background:rgba(255,255,255,.22);padding:6px 10px;border-radius:9px;white-space:nowrap}

  /* ── pulse: Vodafone hero + competitor tiles ── */
  .pulse[hidden]{display:none}
  .pulse{padding:14px 16px 4px}
  .pulse .ph{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--muted);margin:0 2px 9px;
             display:flex;align-items:center;gap:7px}
  .pulse .ph .dt{width:6px;height:6px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 3px var(--pos-bg)}
  .hero{position:relative;display:flex;align-items:center;gap:14px;cursor:pointer;background:var(--card);
        border:1px solid var(--hair);border-radius:18px;padding:16px 17px;box-shadow:0 2px 10px -6px rgba(20,23,28,.15);
        transition:transform .12s,box-shadow .2s;animation:rise .5s both}
  .hero:active{transform:scale(.99)}
  .hero[aria-pressed=true]{border-color:var(--red);box-shadow:0 0 0 2px var(--red-glow)}
  .hero.alert{background:linear-gradient(180deg,var(--neg-bg),var(--card) 60%)}
  .hero.alert::after{content:"";position:absolute;inset:-1px;border-radius:18px;pointer-events:none;
                     box-shadow:0 0 0 0 var(--red-glow);animation:ring 2.4s ease-out infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(230,0,0,.32)}70%,100%{box-shadow:0 0 0 12px rgba(230,0,0,0)}}
  .hero .hlogo{flex:none;width:44px;height:44px;border-radius:13px;background:var(--red);display:grid;place-items:center;
               color:#fff;font-weight:800;font-size:20px;box-shadow:0 6px 16px -6px var(--red-glow)}
  .hero .hbody{flex:1;min-width:0}
  .hero .hb1{display:flex;align-items:baseline;gap:8px}
  .hero .hbrand{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .hero .hpill{font-size:10px;font-weight:800;letter-spacing:.04em;padding:3px 9px;border-radius:20px;text-transform:uppercase}
  .hero .hbig{display:flex;align-items:baseline;gap:6px;margin-top:7px}
  .hero .hn{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .hero .hu{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.15}
  .hbar{display:flex;height:7px;border-radius:5px;overflow:hidden;margin-top:11px;background:var(--hair-2)}
  .hbar i{display:block;height:100%;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}
  .tile{cursor:pointer;background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:11px 12px;text-align:left;
        font-family:var(--sans);transition:transform .12s,border-color .15s;animation:rise .5s both}
  .tile:active{transform:scale(.98)}
  .tile[aria-pressed=true]{border-color:var(--tc);box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 22%,transparent)}
  .tile .tt{display:flex;align-items:center;gap:6px}
  .tile .tdot{width:8px;height:8px;border-radius:3px;flex:none}
  .tile .tb{font-size:12.5px;font-weight:800}
  .tile .tbar{display:flex;height:5px;border-radius:4px;overflow:hidden;margin-top:9px;background:var(--hair-2)}
  .tile .tbar i{display:block;height:100%;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .tile .tc-cnt{margin-top:8px;font-family:var(--mono);font-size:10px;color:var(--faint)}
  .tile .tc-cnt b{color:var(--ink-2)} .tile .tc-cnt .neg{color:var(--neg);font-weight:700} .tile .tc-cnt .pos{color:var(--pos);font-weight:700}

  /* ── filter bar ── */
  .bar2[hidden]{display:none}
  /* NOT sticky. It stacks four rows (status + Show + Since), which pinned under
     the 92px header left ~250px of permanent chrome on a 390px phone — a third
     of the viewport spent on controls while reading cards. The one control that
     has to stay reachable while scrolling is Sort, and that now lives in .sortbar
     below; everything here is a filter you set once and scroll past. */
  .bar2{background:var(--barbg);backdrop-filter:blur(12px);
        border-bottom:1px solid var(--hair);padding:11px 16px 10px;margin-top:12px}
  .status{font-size:12px;color:var(--muted);margin-bottom:9px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .status b{color:var(--ink);font-weight:700} .status .neg{color:var(--neg);font-weight:700} .status .sep{color:var(--faint)}
  .frow{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;--edge:var(--bg)}
  /* SCROLL HINT — a row that scrolls sideways with a hidden scrollbar gives no
     sign that there is more. Seven admin tabs on a phone showed four, and the
     other three simply did not exist as far as the reader was concerned.
     Pure CSS, no JS and no extra markup: two `local` gradients scroll WITH the
     content and mask two `scroll`-attached shadows, so a shadow appears only on
     the side that has more to show and disappears when you reach that end.
     `--edge` is the row's own background colour — the mask has to match what is
     behind it, or the trick shows its seams. */
  .scrollhint{
    background:
      linear-gradient(90deg, var(--edge) 40%, rgba(255,255,255,0)) left center / 28px 100% no-repeat local,
      linear-gradient(-90deg, var(--edge) 40%, rgba(255,255,255,0)) right center / 28px 100% no-repeat local,
      radial-gradient(farthest-side at 0 50%, rgba(20,23,28,.16), rgba(20,23,28,0)) left center / 12px 100% no-repeat scroll,
      radial-gradient(farthest-side at 100% 50%, rgba(20,23,28,.16), rgba(20,23,28,0)) right center / 12px 100% no-repeat scroll;
  }

  .frow::-webkit-scrollbar{display:none}
  .frow+.frow{margin-top:7px}
  .dfilter{display:none;align-items:center;justify-content:space-between;gap:10px;margin:12px 16px 2px;padding:9px 13px;
           background:var(--neg-bg);border:1px solid var(--neg-line);border-radius:12px;font-size:13px;color:var(--ink-2)}
  .dfilter.on{display:flex}
  .dfilter .dk{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:2px}
  .dfilter .dfsub{color:var(--muted);font-weight:600}
  .dfilter .dfx{flex:none;cursor:pointer;border:1px solid var(--neg-line);background:#fff;color:var(--red-deep);font-size:11.5px;font-weight:700;border-radius:9px;padding:6px 11px;white-space:nowrap}
  .dfilter .dfx:hover{background:var(--red);color:#fff;border-color:var(--red)}
  /* live auto-refresh: floating "N new" pill when fresh stories land while reading */
  .newpill{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;
           background:var(--red);color:#fff;border:0;border-radius:999px;padding:10px 18px;
           font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;
           box-shadow:0 8px 24px -8px rgba(230,0,0,.55);animation:pillIn .25s ease}
  .newpill:hover{background:var(--red-deep,#c50000)}
  @keyframes pillIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
  @media (prefers-reduced-motion:reduce){ .newpill{animation:none} }
  .flabel{flex:none;align-self:center;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding-right:2px}
  .chip{flex:none;cursor:pointer;border:1px solid var(--hair);background:var(--card);color:var(--ink-2);
        font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:11px;white-space:nowrap;transition:all .12s}
  .chip:hover{border-color:var(--faint)}
  .chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.alert[aria-pressed=true]{background:var(--red);border-color:var(--red);box-shadow:0 6px 16px -8px var(--red-glow)}

  /* ── list ── */
  .list{padding:10px 16px 76px}
  .empty,.gate{text-align:center;color:var(--muted);padding:64px 26px;font-size:14px;line-height:1.7}
  .gate code{background:var(--card);border:1px solid var(--hair);padding:2px 8px;border-radius:6px;color:var(--ink);font-family:var(--mono)}
  /* THE SLIM STICKY BAR — lane context on the left, sort on the right.
     Sort used to sit in .bar2, which meant that once you scrolled into the
     cards you had to scroll all the way back up to re-order them. It is the one
     control that has to survive scrolling, so it gets its own bar and .bar2
     stops pinning.
     The lane label MIRRORS the .sechead you are currently reading (updated on
     scroll) — deliberately, because pinning a bar over the list otherwise hides
     the very heading that says which lane a card belongs to. It is
     aria-hidden: the real headings are still in the list, and a label that
     re-announced itself on every scroll tick is how a screen reader user turns
     announcements off. */
  .sortbar[hidden]{display:none}
  .sortbar{position:sticky;top:var(--mh);z-index:32;display:flex;align-items:center;gap:10px;
           background:var(--barbg);backdrop-filter:blur(12px);border-bottom:1px solid var(--hair);
           padding:8px 16px}
  /* flex BASIS, not flex:1 — the lane label is the only shrinkable child here,
     and a bare flex:1 among flex:none siblings absorbs every shortfall (the
     fault this file has now hit four times). It truncates rather than crushing
     the chips, and its content is never lost: the same label is in the list. */
  .sbl{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;
       font-size:12.5px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
  .sbl .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sbl .tick{width:9px;height:9px;border-radius:4px;flex:none}
  .sbl .n{font-size:10.5px;font-weight:700;color:#fff;border-radius:20px;padding:1px 7px;flex:none}
  .sortbar #sortRow{flex:none;gap:6px}
  /* Below 380px the label goes rather than the controls: its function is fully
     reachable — the same heading is inline in the list two lines away — while a
     shrunken chip is a control you cannot reliably tap. */
  @media (max-width:379px){ .sbl{display:none} .sortbar #sortRow{flex:1 1 auto} }
  .sechead{display:flex;align-items:center;gap:9px;padding:20px 2px 9px}
  .sechead .tick{width:10px;height:10px;border-radius:4px;flex:none}
  .sechead .lab{font-size:13px;font-weight:800;letter-spacing:-.01em}
  .sechead .n{font-size:11px;font-weight:700;color:#fff;background:var(--faint);border-radius:20px;padding:1px 8px;min-width:20px;text-align:center}

  /* ── card ── */
  .card{position:relative;background:var(--card);border:1px solid var(--hair);border-radius:18px;padding:16px 17px;margin:11px 0;
        box-shadow:0 2px 12px -8px rgba(20,23,28,.18);animation:rise .5s both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card.negative{background:linear-gradient(180deg,var(--neg-bg),var(--card) 42%);border-color:var(--neg-line)}
  .card.positive{border-color:var(--pos-line)}
  .card.crit::before{content:"";position:absolute;inset:-1px;border-radius:18px;pointer-events:none;animation:ring 2.6s ease-out infinite}
  .c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

<script>
const $ = (s, r=document) => r.querySelector(s);
const esc = (s) => String(s==null?'':s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
// Browser mirror of lib/safe-url.js — see the rule and the reasoning there.
// esc() is NOT a substitute: `javascript:alert(1)` contains no character that
// HTML-escaping touches, so an escaped hostile URL is still a working
// javascript: href. Every href built from stored article data goes through this
// and renders as plain text when it comes back null.
// Kept in sync by render-safe-url (which asserts both sides agree on the same
// table of cases).
const SAFE_SCHEMES = ['https:','http:'];
function safeUrl(v){
  if(typeof v!=='string') return null;
  const raw=v.trim();
  if(!raw||raw.length>2048) return null;
  if(/[\u0000-\u001f\u007f-\u009f]/.test(raw)) return null;   // "java\tscript:" and friends
  if(raw.startsWith('//')) return null;                        // protocol-relative
  let u; try{ u=new URL(raw); }catch(e){ return null; }
  if(!SAFE_SCHEMES.includes(u.protocol)) return null;
  if(!u.hostname) return null;
  if(u.username||u.password) return null;                      // https://vodafone.com.eg@evil/
  return u.href;
}
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

const params = new URLSearchParams(location.search);

// ── session (Task 16: magic-link auth) ──────────────────────────────────────

// Session, sign-out and the authenticated fetch wrapper live in

captureSessionFromHash();

// Identity (email + role). Viewers are read-only, so we hide write controls.
let ME=null;
async function loadMe(){
  try{ const r=await afetch('/api/auth?view=me'); if(r.ok){ ME=await r.json(); document.body.dataset.role=ME.role||''; renderAccount(); } }catch(e){}
}
function renderAccount(){
  const el=$('#account'); if(!el) return;

  if(ME&&ME.role==='admin'){ h+=`<a class="acctlink" href="/admin" title="Admin panel — users, subscribers, feedback, audit">⚙ Admin</a>`; }
  if(ME&&ME.email){
    // Everything about YOUR account behind one button: which account you are
    // signed into, changing the password, and signing out. All three were
    // separate header pills, and the two that mattered most were hidden on a
    // phone for want of room.
    h+=`<div class="acct" id="acct" data-open="false">
      <button class="acct-btn" type="button" id="acctBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="acctMenu"
              title="Your account — change your password or sign out">Account
        <svg class="chev" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg>
      </button>

        <a class="acct-item" role="menuitem" href="/account"><span class="ic" aria-hidden="true">🔒</span>Change password</a>
        <button class="acct-item danger" role="menuitem" type="button" id="acctOut"><span class="ic" aria-hidden="true">⇥</span>Sign out</button>
      </div>

}
// Wired after every render, since renderAccount replaces the whole cluster.
function wireAccountMenu(){
  const wrap=$('#acct'), btn=$('#acctBtn'); if(!wrap||!btn) return;

  btn.onclick=(e)=>{ e.stopPropagation(); setOpen(wrap.dataset.open!=='true'); };

  // a menu you can only dismiss by picking something is a menu that traps you.
  wrap.querySelectorAll('.acct-item').forEach(i=>i.addEventListener('click',()=>setOpen(false)));
  if(!wireAccountMenu._global){
    wireAccountMenu._global=true;
    document.addEventListener('click',(e)=>{ const w=$('#acct'); if(w&&!w.contains(e.target)) closeAcct(); });
    document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') closeAcct(); });
  }
}
// aria-expanded has to move WITH the panel, or a screen reader announces a menu
// that is no longer there.
function closeAcct(){
  const w=$('#acct'); if(!w) return;

}

const BRANDS = ['Vodafone','Orange','WE','e&'];
const BRAND_COLOR = { Vodafone:'#e60000', Orange:'#ff7900', WE:'#7b1fa2', 'e&':'#00857b', market:'#6c7480' };
const SENT = {
  negative:{ label:'Negative', color:'#e60000', tag:'⚠' },
  positive:{ label:'Positive', color:'#0f9d58', tag:'✓' },
  neutral :{ label:'Neutral',  color:'#5b6675', tag:'•' },
};
const IMP = {5:'#e60000',4:'#f27100',3:'#e2a900',2:'#3a7ac2',1:'#9aa2ad'};

let ITEMS=[]; let fBrand='all', fSent='all', fWin=Number(localStorage.getItem('pr_win'))||2, fPin='all', fLowConf='all';
// Card ORDER. 'impact' is the board's original and only order — biggest first,
// within the three lanes. 'newest' sets the lanes aside for one flat run in
// publication order, which is the honest shape of "what just landed": sorting
// by time INSIDE the lanes would still bury the freshest story under two
// sections. Deliberately NOT persisted (unlike pr_win): a sort you set once and
// forgot would quietly hide an Impact 5 below a trickle of fresh trivia, and on
// a monitoring board the safe default has to be what loads.
let fSort='impact';
// Deep-link filters from the Trends page: click a category / outlet / journalist
// there to land on the board showing exactly those cards.
let fCat=params.get('cat')||'', fOutlet=params.get('outlet')||'', fAuthor=params.get('author')||'';
let fIds=(params.get('ids')||'').split(',').map(Number).filter(Boolean), fLabel=params.get('label')||'';
// The narrative's TRUE story count, sent alongside the ids. When it exceeds the
// ids we were given (a cluster past the API's per-request id cap), the banner
// must SAY the view is a subset — silently showing fewer cards than Trends
// promised is the bug this guards.
let fIdsTotal=Number(params.get('n'))||0;
if(params.get('brand')) fBrand=params.get('brand');
if(params.get('sent')) fSent=params.get('sent');
{ const w=Number(params.get('win')); if([1,2,7,30].includes(w)) fWin=w; }
const itemHasOutlet=(it,o)=>Array.isArray(it.instances)&&it.instances.some(x=>x&&x.outlet===o);
const itemHasAuthor=(it,a)=>(it.author===a)||(Array.isArray(it.instances)&&it.instances.some(x=>x&&x.author===a));
function deepFilter(){ if(fIds.length) return{kind:'Narrative',val:fLabel||`${fIds.length} stories`}; if(fCat) return{kind:'Category',val:String(fCat).replace(/_/g,' ')}; if(fOutlet) return{kind:'Outlet',val:fOutlet}; if(fAuthor) return{kind:'Journalist',val:fAuthor}; return null; }
function clearDeepFilter(){ fCat=fOutlet=fAuthor=''; fIds=[]; fLabel=''; fIdsTotal=0; try{ const u=new URL(location.href); ['cat','outlet','author','ids','label','n'].forEach(k=>u.searchParams.delete(k)); history.replaceState(null,'',u.pathname+(u.search||'')+u.hash); }catch(e){} render(); }

// team_share pins are SERVER state (shared with the team view), but pinned
// items can be older than the current window — so we also remember pinned ids
// locally and fetch them by id for the Pinned filter (the API supports ?ids=).
function pinnedSet(){ try{ return new Set(JSON.parse(localStorage.getItem('pr_pinned')||'[]').map(Number)); }catch(e){ return new Set(); } }
function savePinned(set){ try{ localStorage.setItem('pr_pinned',JSON.stringify([...set])); }catch(e){} }

function clock(){
  const now=new Date();
  $('#clockDate').textContent=now.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',timeZone:'Africa/Cairo'}).toUpperCase();
  $('#clockTime').textContent=now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Cairo'})+' CAI';
}
clock(); setInterval(clock,30000);

// Countdown to the next urgent scan. The cron fires every 15 minutes on the
// quarter hour in UTC, and Cairo is a whole number of hours offset, so the
// minute hand is the same either way and the next fire is computable without
// asking the server. (Line comments deliberately: the cron expression contains
// the characters that end a block comment.) Purely informational — it says when
// the pipeline next LOOKS, not when the board repaints; that is checkNew's job.
const SCAN_EVERY_MIN = 15;
function msToNextScan(){
  const d = new Date();
  const into = (d.getUTCMinutes() % SCAN_EVERY_MIN) * 60000 + d.getUTCSeconds() * 1000 + d.getUTCMilliseconds();
  return SCAN_EVERY_MIN * 60000 - into;
}
let scanArmed = 0;   // guards against re-arming the post-scan check every tick
function tickScan(){
  const el = $('#nextScan'); if(!el) return;            // pulse not rendered yet
  const ms = msToNextScan();
  const s = Math.max(0, Math.round(ms / 1000));
  const mm = Math.floor(s / 60), ss = String(s % 60).padStart(2, '0');
  el.innerHTML = `next scan <b>${mm}:${ss}</b>`;
  el.classList.toggle('due', s <= 30);
  // Just after a scan fires, ask the API whether anything new landed instead of
  // waiting out the 5-minute poll — the run itself takes well under a minute.
  if (ms > (SCAN_EVERY_MIN - 1) * 60000 && Date.now() - scanArmed > 60000) {
    scanArmed = Date.now();
    setTimeout(() => { try { checkNew(); } catch(e){} }, 75000);
  }
}
tickScan(); setInterval(tickScan, 1000);

const sentOf = it => SENT[it.sentiment]?it.sentiment:'neutral';
// Sentiment reads the same way on every brand: how the story lands for the brand
// it is ABOUT. A rival's win is Positive (positive for them), a rival's outage
// Negative — no inversion, no per-brand relabelling. What a competitor story
// means for US is carried by Impact (severity) and by the lane, not by the pill.
const sentLabel = it => SENT[sentOf(it)].label;
const SENT_TIP = 'How the story reads for the brand it’s about — the same scale for Vodafone and for rivals.';
// Section lane (what WE do about it) — distinct from the item's own sentiment.
// The action lanes ("Needs a response", "Wins to amplify") are Vodafone-only:
// a competitor's story — good or bad — is market intel, so it drops to the
// "Market & noted" lane rather than reading as our win or our fire to fight.
// sentOf() is untouched, so each card keeps its true sentiment badge.
const laneOf = it => ((it.brand||'')==='Vodafone') ? sentOf(it) : 'neutral';
// Coverage spread is how many OUTLETS ran the story, not how many rows we hold.
// One outlet can appear several times — the same article under a Google-News
// redirect and its resolved link, or two write-ups by the same desk — and
// counting rows made a card claim "3 outlets" for a single publisher. Collapse
// by outlet, keeping the row with a real publisher link and a byline.
function uniqOutlets(insts){
  const list=Array.isArray(insts)?insts.filter(x=>x&&(x.outlet||x.url)):[];
  const by=new Map();
  for(const x of list){
    const key=String(x.outlet||x.url||'').trim().toLowerCase(); if(!key) continue;
    const cur=by.get(key);
    if(!cur){ by.set(key,x); continue; }
    // Keep the best of BOTH rows: the publisher's own link (not the Google-News
    // redirect) and, from whichever row has one, the byline — the duplicate is
    // often the only signed copy, so picking one row wholesale loses it.
    const gn=u=>/news\.google\.com/.test(String(u||''))?1:0;
    const primary=gn(cur.url)!==gn(x.url)?(gn(cur.url)<gn(x.url)?cur:x):(cur.url?cur:x);
    const other=primary===cur?x:cur;
    by.set(key,{...primary,author:primary.author||other.author||null});
  }
  return [...by.values()];
}
const spreadOf = it => uniqOutlets(it.instances).length;
const linkOf = it => safeUrl(it.resolved_url) || safeUrl(it.url) || (it.id?`/api/go?id=${it.id}`:'#');
// Critical (red ring / "needs eyes") is a Vodafone-action signal — a competitor's
// negative story is market intel, not our crisis, so it never trips crit.
const isCrit = it => sentOf(it)==='negative' && it.brand==='Vodafone' && (it.importance||0)>=4;

function dots(imp){ const n=Math.max(1,Math.min(5,imp||1)); let o=''; for(let i=1;i<=5;i++) o+=`<span style="color:${i<=n?IMP[n]:'var(--dot-empty)'}">&#9679;</span>`; return o; }
// Subtle provenance cue: how confident the classifier was in this read. 3-bar
// meter, amber when low (<50%) so an uncertain classification is worth a second
// look. Hidden when confidence wasn't stored.
const confTier=c=>c>=0.75?3:c>=0.5?2:1;
function confPip(it){ const c=it.confidence; if(c==null) return ''; const t=confTier(c),low=c<0.5; const pct=Math.round(c*100);
  return `<span class="conf ${low?'low':''}" title="How sure the classifier was about this read${low?' — low, double-check':''}">`
    +`<span class="cpip">${[1,2,3].map(n=>`<i class="${n<=t?'on':''}"></i>`).join('')}</span>`
    +`<span class="cplab">${pct}% confidence${low?' · low':''}</span></span>`; }
const isLowConf=it=>it.confidence!=null&&it.confidence<0.5;
function ageLabel(it){ const t=it.published_at||it.seen_at; if(!t) return ''; const h=Math.max(0,(Date.now()-new Date(t).getTime())/36e5); if(h<1) return 'just now'; if(h<24) return Math.round(h)+'h ago'; return Math.round(h/24)+'d ago'; }
function dueLabel(it){ if(!it.deadline) return ''; const h=(new Date(it.deadline)-Date.now())/36e5; if(h<0) return 'overdue'; if(h<1) return 'due <1h'; if(h<48) return 'due '+Math.round(h)+'h'; return 'due '+Math.round(h/24)+'d'; }
function animateBars(root=document){ const els=root.querySelectorAll('[data-w]'); if(RM){els.forEach(i=>i.style.width=i.dataset.w);return;} requestAnimationFrame(()=>els.forEach(i=>i.style.width=i.dataset.w)); }
function countUp(el,to){ if(!el) return; if(RM||to<=0){el.textContent=to;return;} let s=null; const step=t=>{if(!s)s=t;const p=Math.min(1,(t-s)/650);el.textContent=Math.round(p*to);if(p<1)requestAnimationFrame(step);}; requestAnimationFrame(step); }
function stagger(root){ if(RM) return; root.querySelectorAll('.card').forEach((c,i)=>c.style.animationDelay=Math.min(i*45,400)+'ms'); }

/* ── pulse: Vodafone hero + competitor tiles ── */
function buildPulse(){
  const V='Vodafone'; const vr=ITEMS.filter(i=>(i.brand||'')===V);
  const vneg=vr.filter(i=>sentOf(i)==='negative').length, vpos=vr.filter(i=>sentOf(i)==='positive').length, vneu=vr.length-vneg-vpos;
  const vsev=Math.max(0,...vr.filter(i=>sentOf(i)==='negative').map(i=>i.importance||0));
  let pill,pillbg,pillc,alert=false;
  if(vsev>=4){pill='Alert';pillbg='var(--neg-bg)';pillc='var(--red-deep)';alert=true;}
  else if(vneg>0){pill='Watch';pillbg='#fff5e6';pillc='var(--amber)';}
  else {pill='Clear';pillbg='var(--pos-bg)';pillc='var(--pos)';}
  const vtot=vr.length||1;
  const vseg=(n,c)=>n?`<i data-w="${(n/vtot*100).toFixed(1)}%" style="background:${c}"></i>`:'';
  const vbar=vr.length?vseg(vneg,'#e60000')+vseg(vneu,'var(--seg-neu)')+vseg(vpos,'#0f9d58'):`<i data-w="100%" style="background:var(--seg-empty)"></i>`;

  const tiles=BRANDS.filter(b=>b!==V).map(b=>{
    const rows=ITEMS.filter(i=>(i.brand||'')===b);
    const neg=rows.filter(i=>sentOf(i)==='negative').length, pos=rows.filter(i=>sentOf(i)==='positive').length, neu=rows.length-neg-pos, tot=rows.length||1;
    const seg=(n,c)=>n?`<i data-w="${(n/tot*100).toFixed(1)}%" style="background:${c}"></i>`:'';
    const bar=rows.length?seg(neg,'#e60000')+seg(neu,'var(--seg-neu)')+seg(pos,'#0f9d58'):`<i data-w="100%" style="background:var(--seg-empty)"></i>`;
    // The number that matters on a rival's tile is their WINS — the coverage
    // that invites a comparison with us. Sentiment is the brand's own, so a
    // rival's win is stored positive; the tile counts those.
    const cnt=rows.length?`<span class="${pos?'pos':''}"><b>${pos}</b></span> ${pos===1?'win':'wins'} · ${rows.length}`:'no items';
    const tileTip=rows.length?`${b}: ${pos} positive stor${pos===1?'y':'ies'} of ${rows.length} — wins for them, worth a comparative look`:`${b}: no stories in this window`;
    return `<button class="tile" type="button" data-b="${esc(b)}" aria-pressed="${fBrand===b}" title="${esc(tileTip)}" style="--tc:${BRAND_COLOR[b]}">
      <span class="tt"><span class="tdot" style="background:${BRAND_COLOR[b]}"></span><span class="tb">${esc(b)}</span></span>
      <span class="tbar">${bar}</span><span class="tc-cnt">${cnt}</span></button>`;
  }).join('');

  $('#pulse').innerHTML=
    `<div class="ph"><span class="dt"></span>Today’s reputation pulse<span class="nxt" id="nextScan" title="The urgent scan runs every 15 minutes, on the quarter hour. New stories reach the board a minute or two after it finishes."></span><button class="shbtn" type="button" onclick="snapshotPulse()" title="Share a branded snapshot">📸 Share</button></div>
     <div class="hero ${alert?'alert':''}" role="button" tabindex="0" data-b="${V}" aria-pressed="${fBrand===V}">
       <div class="hlogo">V</div>
       <div class="hbody">
         <div class="hb1"><span class="hbrand">Vodafone</span><span class="hpill" style="background:${pillbg};color:${pillc}">${pill}</span></div>
         <div class="hbig"><span class="hn" id="vNeg">0</span><span class="hu">negative<br>of ${vr.length} tracked</span></div>
         <div class="hbar">${vbar}</div>
       </div></div>
     <div class="tiles">${tiles}</div>`;
  countUp($('#vNeg'),vneg);
  const hero=$('#pulse .hero');
  const toggleV=()=>{ fBrand=(fBrand===V)?'all':V; syncControls(); render(); };
  hero.onclick=toggleV; hero.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleV();} };
  $('#pulse').querySelectorAll('.tile').forEach(c=>c.onclick=()=>{ fBrand=(fBrand===c.dataset.b)?'all':c.dataset.b; syncControls(); render(); });
  $('#pulse').hidden=false;
  animateBars($('#pulse'));
  tickScan();   // fill the countdown NOW; the 1s interval only keeps it moving
}

function buildSpotlight(){
  const el=$('#spotlight');
  // "Needs eyes now" is an urgent-action prompt, so it only fires for Vodafone —
  // a competitor's bad news isn't ours to jump on.
  const worst=ITEMS.filter(i=>sentOf(i)==='negative'&&i.brand==='Vodafone').sort((a,b)=>(b.importance||0)-(a.importance||0)||spreadOf(b)-spreadOf(a))[0];
  const spread=worst?spreadOf(worst):0;
  if(worst&&((worst.importance||0)>=4||spread>=4)){
    const where=spread>1?` · ${spread} outlets`:'';
    // <bdi> isolates the headline's direction from the Latin "Brand · N outlets"
    // prefix — otherwise an Arabic headline inherits the span's LTR base and
    // scrambles (5G splits, trailing ! jumps to the wrong end).
    $('#spotlightText').innerHTML=`<b>${esc(worst.brand||'Market')}${where}</b> — <bdi>${esc(worst.headline)}</bdi>`;
    el.classList.add('on');
    el.onclick=()=>{ const c=document.getElementById('item-'+worst.id); if(c){ c.scrollIntoView({behavior:'smooth',block:'center'}); c.style.transition='box-shadow .3s'; c.style.boxShadow='0 0 0 3px var(--red-glow)'; setTimeout(()=>c.style.boxShadow='',1500);} };
  } else el.classList.remove('on');
}

function angleHtml(text){
  const src=String(text||'').trim(); if(!src) return '';
  const lines=[];
  for(const raw of src.split(/\r?\n+/)){ const m=raw.trim().match(/^([A-Za-z][A-Za-z \/&]*?)\s*[·:\-–—]\s*(.*)$/); if(!m) continue; const v=m[2].trim(); if(!v||/^[—–\-·.\s]*$/.test(v)) continue; lines.push([m[1].trim(),v]); }
  const body=lines.length?`<table>${lines.map(([k,v])=>`<tr><td class="k">${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>`:`<div class="plain">${esc(src)}</div>`;
  return `<div class="angle"><div class="lab">What to do with this</div>${body}</div>`;
}
function coverageHtml(insts){
  const list=uniqOutlets(insts); if(list.length<2) return '';
  const rows=list.slice(0,16).map(x=>{ const name=esc(x.outlet||'—'); const u=safeUrl(x.url); const link=u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${name}</a>`:`<span style="font-weight:600">${name}</span>`; const by=x.author?` <span class="au">· ${esc(x.author)}</span>`:''; return `<div class="row">${link}${by}</div>`; }).join('');
  const more=list.length>16?`<div class="row au">+${list.length-16} more outlets</div>`:'';
  return `<details class="cov"><summary>📰 Coverage · ${list.length} outlets<span class="chev">›</span></summary><div class="rows">${rows}${more}</div></details>`;
}

function cardHtml(it){
  const sent=sentOf(it); const s=SENT[sent]; const crit=isCrit(it);
  const brand=it.brand?`<span class="bchip" style="background:${BRAND_COLOR[it.brand]||'#6c7480'}">${esc(it.brand)}</span>`:'';
  const spread=spreadOf(it);
  const spreadBadge=spread>1?`<span class="spread ${sent==='negative'&&spread>=4?'hot':''}" title="${spread} outlets ran this">◱ ${spread} outlets</span>`:'';
  const cat=it.category?`<span class="cat">${esc(String(it.category).replace(/_/g,' '))}</span>`:'';
  const age=ageLabel(it); const ageEl=age?`<span class="age">${esc(age)}</span>`:'';
  // /api/go re-validates server-side; the direct fallback is validated here.
  const href=it.id?`/api/go?id=${it.id}`:(safeUrl(it.url)||'#');
  // Attribution is never blank: a person byline when we have one, else the
  // publication's newsroom (unbylined copy is desk-written — that IS the author).
  // DISPLAY-ONLY fallback: nothing is written to the DB, so the journalist
  // analytics and the authorless-backfill counter stay clean.
  const desk=(Array.isArray(it.instances)&&it.instances[0]&&it.instances[0].outlet)||it.source||'';
  const by=it.author?`<span class="by">By ${esc(it.author)}</span>`
    :desk?`<span class="by desk" title="No individual byline — attributed to the publication's newsroom">${esc(desk)} · newsroom</span>`
    :`<span class="by none">Author —</span>`;
  const due=dueLabel(it); const dueEl=due?`<span class="due ${sent==='negative'?'hot':''}">⧗ ${esc(due)}</span>`:'';
  const fb=it.feedback;
  const pinned=it.team_share===true, hidden=it.team_share===false;
  const pinMark=pinned?`<span class="pinmark pin" title="Pinned for the team">📌 Pinned</span>`:hidden?`<span class="pinmark hide" title="Hidden from the team view">🙈 Hidden</span>`:'';
  return `<article class="card ${sent}${crit?' crit':''}${pinned?' pinned':''}${hidden?' hidden':''}" id="item-${it.id}">
    <div class="c-top"><div class="metas">${brand}${spreadBadge}${cat}${ageEl}${confPip(it)}${pinMark}</div>
      <div class="dots" title="Impact ${it.importance||1} of 5 — how much this matters to us: how directly it hits Vodafone, and how far it travelled"><span class="dlab">Impact</span>${dots(it.importance)}</div></div>
    <h3 class="headline"><a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(it.headline)}</a></h3>
    <div class="subrow"><span class="sent ${sent}" title="${SENT_TIP}">${sentLabel(it)}</span>${by}${dueEl}</div>
    ${it.summary?`<p class="summary">${esc(it.summary)}</p>`:''}
    ${angleHtml(it.pr_angle)}
    ${coverageHtml(it.instances)}
    <div class="foot">
      <button class="btn copy" type="button" onclick="copyBrief(${it.id},this)">⧉ Copy brief</button>
      <button class="fb share" type="button" aria-label="Share a branded snapshot of this story" title="Share a branded snapshot" onclick="snapshotCard(${it.id})">📸</button>
      <button class="fb alert" type="button" aria-label="Send this story as an instant alert to the full alert list" title="Send this card as an instant alert — email (and WhatsApp when live) to the full alert list. For cards corrected after ingest; the rule still applies." onclick="sendAlert(${it.id},this)">🔔</button>
      <div class="more" data-open="false">
        <button class="fb morebtn" type="button" aria-haspopup="true" aria-expanded="false"
                aria-label="More actions for this story" title="More actions" onclick="toggleMore(this,event)">•••</button>
        <div class="moremenu" role="menu" aria-label="More actions">
          <button class="mitem pin" type="button" role="menuitem" aria-pressed="${pinned}" onclick="togglePin(${it.id},'pin',this)"><span aria-hidden="true">📌</span> ${pinned?'Unpin':'Pin for the team'}</button>
          <button class="mitem hide" type="button" role="menuitem" aria-pressed="${hidden}" onclick="togglePin(${it.id},'hide',this)"><span aria-hidden="true">🙈</span> ${hidden?'Unhide':'Hide from the team'}</button>
          <div class="msep" role="separator"></div>
          <button class="mitem up" type="button" role="menuitem" aria-pressed="${fb===1}" onclick="vote(${it.id},1,this)"><span aria-hidden="true">▲</span> Useful</button>
          <button class="mitem down" type="button" role="menuitem" aria-pressed="${fb===-1}" onclick="vote(${it.id},-1,this)"><span aria-hidden="true">▼</span> Not useful</button>
        </div>
      </div>
      <a class="btn open" href="${esc(href)}" target="_blank" rel="noopener noreferrer">Open source ↗</a>
    </div></article>`;
}

function actionLine(it){ const m=String(it.pr_angle||'').split(/\r?\n+/).map(l=>l.trim().match(/^action\s*[·:\-–—]\s*(.*)$/i)).find(Boolean); return m?m[1].trim():''; }
async function copyBrief(id,btn){
  const it=ITEMS.find(x=>x.id===id); if(!it) return;
  const s=SENT[sentOf(it)]; const spread=spreadOf(it);
  const head=`${s.tag} ${sentLabel(it).toUpperCase()} · ${it.brand||'Market'}${spread>1?` · ${spread} outlets`:''}`;
  const act=actionLine(it);
  const text=[head,it.headline,act?`Action: ${act}`:'',linkOf(it)].filter(Boolean).join('\n');
  try{ await navigator.clipboard.writeText(text); }catch(e){ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch(_){} t.remove(); }
  const old=btn.textContent; btn.textContent='✓ Copied'; btn.classList.add('copied'); setTimeout(()=>{ btn.textContent=old; btn.classList.remove('copied'); },1500);
}
// Admin: fire the real urgent path for one card, after the fact — for cards
// corrected INTO alert territory after ingest (alerts normally fire at ingest
// only). Confirms first: this button pages the whole alert list.
async function sendAlert(id,btn){
  const it=ITEMS.find(x=>x.id===id); if(!it) return;
  if(!confirm(`Send "${(it.headline||'').slice(0,80)}" as an instant alert to the full alert list?`)) return;
  btn.disabled=true; const old=btn.textContent; btn.textContent='…';
  try{
    const r=await afetch('/api/admin?resource=send-alert',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
    const d=await r.json().catch(()=>({}));
    if(r.status===409 && confirm((d.error||'Already sent.')+'\n\nSend again anyway?')){
      const r2=await afetch('/api/admin?resource=send-alert',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,force:true})});
      const d2=await r2.json().catch(()=>({}));
      alert(r2.ok?`Alert sent (${d2.tier}) — emailed ${d2.emailed}.`:(d2.error||'Failed.'));
    }
    else if(!r.ok) alert(d.error||'Failed.');
    else{ btn.textContent='✓'; setTimeout(()=>{ btn.textContent=old; },2000);
      alert(`Alert sent (${d.tier}) — emailed ${d.emailed}${d.emailFailed?`, ${d.emailFailed} failed`:''}.`); }
  }catch(e){ alert('Network error.'); }
  btn.disabled=false; if(btn.textContent==='…') btn.textContent=old;
}
/* ── the ••• More menu ─────────────────────────────────────────────────────
   Only ONE menu is open at a time, and it closes on Escape, on an outside
   click, and on choosing an item. A menu you can only dismiss by picking
   something is a menu that traps you — the same rule the account menu follows,
   and the listeners are registered once rather than per card (a board can hold
   a hundred of these). */
function closeAllMore(except){
  document.querySelectorAll('.more[data-open="true"]').forEach(m=>{
    if(m===except) return;
    m.dataset.open='false';
    const b=m.querySelector('.morebtn'); if(b) b.setAttribute('aria-expanded','false');
  });
}
function toggleMore(btn,ev){
  if(ev) ev.stopPropagation();
  const wrap=btn.closest('.more'); const open=wrap.dataset.open!=='true';
  closeAllMore(wrap);
  wrap.dataset.open=String(open);
  // aria-expanded has to move WITH the panel, or a screen reader announces a
  // menu that is no longer there.
  btn.setAttribute('aria-expanded',String(open));
  if(open) wrap.querySelector('.mitem')?.focus();
}
if(!window.__moreWired){
  window.__moreWired=true;
  document.addEventListener('click',(e)=>{ if(!e.target.closest('.more')) closeAllMore(); });
  document.addEventListener('keydown',(e)=>{
    if(e.key==='Escape'){
      // Return focus to the button that opened it, or Escape silently strands
      // a keyboard user at the top of the document.
      const open=document.querySelector('.more[data-open="true"]');
      closeAllMore();
      open?.querySelector('.morebtn')?.focus();
      return;
    }
    // Arrow keys walk the open menu, which is what role="menu" promises.
    const wrap=document.querySelector('.more[data-open="true"]'); if(!wrap) return;
    if(e.key!=='ArrowDown'&&e.key!=='ArrowUp') return;
    e.preventDefault();
    const items=[...wrap.querySelectorAll('.mitem')];
    const i=items.indexOf(document.activeElement);
    items[(i+(e.key==='ArrowDown'?1:items.length-1)+items.length)%items.length]?.focus();
  });
}
// Choosing an item closes the menu — after the action, so the label it
// rewrites (Pin ↔ Unpin) is the one the reader sees next time they open it.
function afterMoreAction(btn){ closeAllMore(); }

async function vote(id,val,btn){
  const cur=btn.getAttribute('aria-pressed')==='true'; const next=cur?null:val;
  // Scoped to the two VOTE controls. It used to clear aria-pressed on every
  // `.fb` in the card, which silently un-pressed the pin and hide buttons the
  // moment anyone voted — the stored value was untouched, so it came back on
  // the next render and read as a rendering glitch.
  const card=btn.closest('.card'); card.querySelectorAll('.mitem.up,.mitem.down').forEach(b=>b.setAttribute('aria-pressed','false'));
  if(next!==null) btn.setAttribute('aria-pressed','true');
  afterMoreAction(btn);
  const it=ITEMS.find(x=>x.id===id); if(it) it.feedback=next;
  try{ await afetch(`/api/items`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,feedback:next===null?0:next})}); }catch(e){}
}

// Admin pin (team_share=true) / hide (false) / clear (null). Pin and hide are
// mutually exclusive; clicking the active one clears it. Optimistic: update the
// card + local pinned set, PATCH, and if the Pinned filter is on, re-render so
// an un-pinned card drops out.
async function togglePin(id,mode,btn){
  const it=ITEMS.find(x=>x.id===id); if(!it) return;
  const cur=it.team_share===true?true:it.team_share===false?false:null;
  const next=mode==='pin'?(cur===true?null:true):(cur===false?null:false);
  it.team_share=next;
  const set=pinnedSet(); if(next===true) set.add(id); else set.delete(id); savePinned(set);
  const card=btn.closest('.card');
  card.classList.toggle('pinned',next===true); card.classList.toggle('hidden',next===false);
  const pb=card.querySelector('.mitem.pin'), hb=card.querySelector('.mitem.hide');
  // The menu item carries a LABEL as well as a state, so both move together —
  // an item reading "Pin for the team" while already pinned is a lie.
  if(pb){ pb.setAttribute('aria-pressed',String(next===true));
    pb.innerHTML=`<span aria-hidden="true">📌</span> ${next===true?'Unpin':'Pin for the team'}`; }
  if(hb){ hb.setAttribute('aria-pressed',String(next===false));
    hb.innerHTML=`<span aria-hidden="true">🙈</span> ${next===false?'Unhide':'Hide from the team'}`; }
  afterMoreAction(pb||hb);
  // refresh the little "Pinned/Hidden" marker in the metas row
  const metas=card.querySelector('.metas .pinmark'); if(metas) metas.remove();
  if(next!==null){ const m=document.createElement('span'); m.className='pinmark '+(next===true?'pin':'hide'); m.textContent=next===true?'📌 Pinned':'🙈 Hidden'; card.querySelector('.metas').appendChild(m); }
  try{ await afetch(`/api/items`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,team_share:next})}); }catch(e){}
  if(fPin==='pinned'&&!isPinned(it)) render();
}

function pass(it){ if(fPin==='pinned'&&!isPinned(it)) return false; if(fLowConf==='low'&&!isLowConf(it)) return false; if(fBrand!=='all'&&(it.brand||'')!==fBrand) return false; if(fSent!=='all'&&laneOf(it)!==fSent) return false; if(fIds.length&&!fIds.includes(it.id)) return false; if(fCat&&(it.category||'')!==fCat) return false; if(fOutlet&&!itemHasOutlet(it,fOutlet)) return false; if(fAuthor&&!itemHasAuthor(it,fAuthor)) return false; return true; }
function render(){
  buildPulse(); buildSpotlight();
  // Newest keeps Impact as its TIE-BREAK, so two stories filed the same minute
  // still arrive biggest-first rather than in whatever order the API returned.
  const at=it=>new Date(it.published_at||it.seen_at||0);
  const shown=ITEMS.filter(pass).sort(fSort==='newest'
    ? (a,b)=>at(b)-at(a)||(b.importance||0)-(a.importance||0)
    : (a,b)=>{ const rank=s=>s==='negative'?0:s==='neutral'?1:2; return rank(laneOf(a))-rank(laneOf(b))||(b.importance||0)-(a.importance||0)||spreadOf(b)-spreadOf(a)||at(b)-at(a); });
  const neg=ITEMS.filter(i=>sentOf(i)==='negative').length;
  const brandNote=fBrand==='all'?'':` · <b>${esc(fBrand)}</b>`;
  // Sentiment is each brand's own, so this is simply "stories that ran negative"
  // across everyone tracked — the plain word is now the accurate one.
  // Only the NON-default order is named. Impact is what the board has always
  // done, so announcing it on every load would be noise on a line already
  // carrying three counts — but a flat, lane-less board must say why.
  const sortNote=fSort==='newest'?`<span class="sep">·</span><span><b>Newest</b> first</span>`:'';
  $('#status').innerHTML=`<span><b>${ITEMS.length}</b> tracked</span><span class="sep">·</span><span class="neg" title="Stories that ran negative for the brand they are about, across all tracked brands">${neg} negative</span><span class="sep">·</span><span>${shown.length} shown${brandNote}</span>${sortNote}`;
  // Deep-link filter banner (arrived from Trends) with a one-click clear.
  const df=deepFilter(); const dfEl=$('#dfilter');
  if(df){ const note=(fIds.length&&fIdsTotal>fIds.length)?` <span class="dfsub">top ${fIds.length} of ${fIdsTotal} by reach</span>`:'';
    dfEl.innerHTML=`<span><span class="dk">${esc(df.kind)}</span><b>${esc(df.val)}</b> · ${shown.length} card${shown.length===1?'':'s'}${note}</span><button class="dfx" type="button" onclick="clearDeepFilter()">✕ Clear filter</button>`; dfEl.classList.add('on'); dfEl.hidden=false; }
  else { dfEl.classList.remove('on'); dfEl.hidden=true; }
  const list=$('#list');
  if(!shown.length){ list.innerHTML=`<div class="empty">${df?`No cards for this ${esc(df.kind.toLowerCase())} in the current window.<br>Try a wider window, or clear the filter above.`:'Nothing matches this filter.<br>Clear the brand or widen the time window.'}</div>`; updateLaneLabel(); return; }
  const SEC=[['negative','Needs a response','#e60000'],['positive','Wins to amplify','#0f9d58'],['neutral','Market & noted','#5b6675']];
  let html='';
  if(fSort==='newest'){
    // FLAT: one chronological run, no lane grouping. The cards keep their lane
    // TINT (a needs-response card is still red-washed), so the signal survives
    // even where the sections don't. One header still opens the list — without
    // it, missing lanes read as a rendering bug rather than the order you chose.
    html=`<div class="sechead"><span class="tick" style="background:#5b6675"></span><span class="lab">↓ Newest first</span><span class="n" style="background:#5b6675">${shown.length}</span></div>`
      +shown.map(cardHtml).join('');
  } else {
    for(const [key,label,color] of SEC){ const rows=shown.filter(i=>laneOf(i)===key); if(!rows.length) continue;
      html+=`<div class="sechead"><span class="tick" style="background:${color}"></span><span class="lab">${label}</span><span class="n" style="background:${color}">${rows.length}</span></div>`;
      html+=rows.map(cardHtml).join(''); }
  }
  list.innerHTML=html; stagger(list); animateBars(list); updateLaneLabel();
  if(location.hash){ const el=document.getElementById(location.hash.slice(1)); if(el) el.scrollIntoView(); }
}

/* THE PINNED BAR'S LANE LABEL.
   Pinning a bar over the list hides the .sechead that says which lane you are
   reading, so the bar has to carry that context itself or the fix costs more
   than it gains. It MIRRORS the headings already in the list rather than
   inventing anything: whichever .sechead has scrolled under the bar is the one
   shown, which is the same answer the reader would get by scrolling up. */
function stickyOffset(){
  const b=$('#sortbar');
  return b && !b.hidden ? b.getBoundingClientRect().bottom : 0;
}
function updateLaneLabel(){
  const bar=$('#sortbar'), lane=$('#sbLane');
  if(!bar||bar.hidden||!lane) return;
  const heads=[...document.querySelectorAll('#list .sechead')];
  if(!heads.length){ lane.innerHTML=''; return; }
  // The last heading whose top has passed under the bar; before any has, the
  // first one — you are above the list, and it is what you are about to read.
  const edge=stickyOffset()+1;
  let cur=heads[0];
  for(const h of heads){ if(h.getBoundingClientRect().top<=edge) cur=h; }
  const tick=cur.querySelector('.tick'), lab=cur.querySelector('.lab'), n=cur.querySelector('.n');
  const col=tick?tick.style.background:'var(--faint)';
  lane.innerHTML=`<span class="tick" style="background:${col}"></span>`
    +`<span class="lab">${esc(lab?lab.textContent:'')}</span>`
    +(n?`<span class="n" style="background:${col}">${esc(n.textContent)}</span>`:'');
}
let laneRaf=null;
function onScrollLane(){ if(laneRaf) return; laneRaf=requestAnimationFrame(()=>{ laneRaf=null; updateLaneLabel(); }); }
addEventListener('scroll',onScrollLane,{passive:true});
addEventListener('resize',onScrollLane,{passive:true});

/** Put the top of the list just under the pinned bars. Used after a re-order,
    which otherwise leaves you mid-list looking at cards you did not ask for. */
function scrollListToTop(){
  const l=$('#list'); if(!l) return;
  if(l.getBoundingClientRect().top>=stickyOffset()) return;   // already in view
  const y=window.scrollY+l.getBoundingClientRect().top-stickyOffset();
  window.scrollTo({top:Math.max(0,y)});
  updateLaneLabel();
}

function syncControls(){
  const p=$('#pulse'); const h=p.querySelector('.hero'); if(h) h.setAttribute('aria-pressed',String(fBrand==='Vodafone'));
  p.querySelectorAll('.tile').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.b===fBrand)));
  $('#sentRow').querySelectorAll('.chip[data-v]').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.v===fSent)));
  const pc=$('#sentRow .chip[data-pin]'); if(pc) pc.setAttribute('aria-pressed',String(fPin==='pinned'));
  const lc=$('#sentRow .chip[data-lowconf]'); if(lc) lc.setAttribute('aria-pressed',String(fLowConf==='low'));
  $('#sortRow').querySelectorAll('.chip[data-sort]').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.sort===fSort)));
}
function buildFilters(){
  const sent=$('#sentRow');
  const opts=[['all','All'],['negative','⚠ Needs response'],['positive','Wins'],['neutral','Market']];
  sent.innerHTML=`<span class="flabel">Show</span>`+opts.map(([v,l])=>`<button class="chip ${v==='negative'?'alert':''}" type="button" data-v="${v}" aria-pressed="${fSent===v}">${l}</button>`).join('')
    +`<span class="flabel" style="padding-left:6px">·</span><button class="chip" type="button" data-pin="1" aria-pressed="${fPin==='pinned'}">📌 Pinned</button>`
    +`<button class="chip" type="button" data-lowconf="1" aria-pressed="${fLowConf==='low'}" title="Items the classifier was unsure about (confidence < 50%)">◔ Low-conf</button>`;
  sent.querySelectorAll('.chip[data-v]').forEach(c=>c.onclick=()=>{ fSent=c.dataset.v; syncControls(); render(); });
  const pin=sent.querySelector('.chip[data-pin]');
  pin.onclick=async()=>{ fPin=fPin==='pinned'?'all':'pinned'; syncControls(); if(fPin==='pinned') await loadPinnedExtras(); render(); };
  const low=sent.querySelector('.chip[data-lowconf]');
  low.onclick=()=>{ fLowConf=fLowConf==='low'?'all':'low'; syncControls(); render(); };
  const win=$('#winRow');

  win.innerHTML=`<span class="flabel">Since</span>`+wopts.map(([v,l])=>`<button class="chip" type="button" data-v="${v}" aria-pressed="${String(fWin)===v}">${l}</button>`).join('');
  win.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ fWin=Number(c.dataset.v); localStorage.setItem('pr_win',c.dataset.v); win.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===c.dataset.v))); load(); });
  // Sort is a re-order of what is already loaded — no refetch, and nothing is
  // ever hidden by it, which is why it sits apart from the filter rows above.
  const srt=$('#sortRow');
  const sopts=[['impact','◉ Impact','Biggest first — Impact, then how many outlets ran it. Grouped into the three lanes.'],
               ['newest','↓ Newest','Most recent first, as one flat list. The lane sections are set aside so the freshest story is always at the top.']];
  // No visible "Sort" label here, unlike the rows above: this bar is pinned, so

  srt.innerHTML=sopts.map(([v,l,t])=>`<button class="chip" type="button" data-sort="${v}" aria-pressed="${fSort===v}" title="${t}">${l}</button>`).join('');

    // cards; go back to the top of the list so you see what you just asked for.
    // Only when you are actually scrolled past it — otherwise this yanks the
    // page on every click from the top, where nothing needed to move.
    scrollListToTop();

}

// Pull any pinned items that fall OUTSIDE the current window (older than the
// selected days) so the Pinned filter shows the full saved set, not just the
// pins that happen to be in view. Uses the API's fetch-by-ids.
async function loadPinnedExtras(){
  const missing=[...pinnedSet()].filter(id=>!ITEMS.some(x=>x.id===id));
  if(!missing.length) return;
  try{
    const r=await afetch(`/api/items?ids=${missing.join(',')}`);
    if(!r.ok) return; const extra=await r.json(); if(!Array.isArray(extra)) return;
    const have=new Set(ITEMS.map(i=>i.id)); for(const e of extra) if(!have.has(e.id)) ITEMS.push(e);
  }catch(e){}
}

// Fetch specific ids not already loaded (narrative deep-links may reference
// stories older than the current window). Mirrors loadPinnedExtras.
async function loadIdsExtras(idsWanted){
  const missing=idsWanted.filter(id=>!ITEMS.some(x=>x.id===id));
  if(!missing.length) return;
  try{ const r=await afetch(`/api/items?ids=${missing.join(',')}`); if(!r.ok) return; const extra=await r.json(); if(!Array.isArray(extra)) return;
    const have=new Set(ITEMS.map(i=>i.id)); for(const e of extra) if(!have.has(e.id)) ITEMS.push(e); }catch(e){}
}

// Skeleton placeholders — replaces the plain "Loading the board…" on first load
// and while switching windows, so the board never shows a bare text state.
function skeletons(n=4){ let h='<div class="skel-wrap">'; for(let i=0;i<n;i++) h+=`<div class="skel"><div class="ln w40"></div><div class="ln tall w90"></div><div class="ln w70"></div><div class="ln w40"></div></div>`; return h+'</div>'; }

async function load(){
  if(!session){ location.href='/login'; return; }             // not signed in → sign in
  if(!ITEMS.length) $('#list').innerHTML=skeletons();      // first paint: skeletons, not bare text
  else $('#list').style.opacity='.45';                     // refetch: hold the frame, don't flash
  try{
    const r=await afetch(`/api/items?days=${fWin}`);
    if(r.status===401){ location.href='/login'; return; }   // session expired / rejected → sign in
    if(r.status===403){ $('#list').innerHTML=`<div class="gate">Your account isn't authorised for this board.<br>Ask an admin to add you.</div>`; return; }
    ITEMS=await r.json(); if(!Array.isArray(ITEMS)) ITEMS=[];
    STAGED=null; hideNewPill();   // a manual reload supersedes any pending auto-refresh
    // Sync local pinned set with server pins visible in this window (covers a
    // pin made on another device), then top up out-of-window pins if filtering.
    const set=pinnedSet(); for(const it of ITEMS) if(it.team_share===true) set.add(it.id); savePinned(set);
    if(fPin==='pinned') await loadPinnedExtras();
    if(fIds.length) await loadIdsExtras(fIds);   // a narrative's stories may be older than the window
    render();
  }catch(e){ $('#list').innerHTML=`<div class="empty">Couldn't load the board.<br>${esc(e.message||e)}</div>`; }
  finally{ $('#list').style.opacity=''; }
}

/* ── Live auto-refresh ──────────────────────────────────────────────────────
   The pipeline ingests new stories every ~15 min (the urgent-only cron). Keep
   an OPEN board current without a manual reload — and without yanking the
   reader's place. Every few minutes we quietly re-fetch the current window,
   diff against what's shown, and: if the reader is at the top, refresh in
   place; otherwise surface a dismissible "N new — tap to update" pill. Only
   counts new cards the ACTIVE filter would actually show, so the pill never
   lies. Skipped for a hidden tab, the pinned view, and narrative deep-links. */
const AUTO_REFRESH_MS = 5 * 60 * 1000;   // poll cadence (news itself lands ~every 15 min)
let STAGED = null;
function hideNewPill(){ const p=$('#newPill'); if(p) p.hidden=true; }
function showNewPill(n){ const p=$('#newPill'); if(!p) return; p.textContent=`↻ ${n} new stor${n===1?'y':'ies'} — tap to update`; p.hidden=false; }
function applyStaged(){
  if(!STAGED) return;
  ITEMS=STAGED; STAGED=null;
  const set=pinnedSet(); for(const it of ITEMS) if(it.team_share===true) set.add(it.id); savePinned(set);
  render(); hideNewPill();
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){}
}
async function checkNew(){
  if(!session || document.hidden) return;           // don't poll a backgrounded tab
  if(fPin==='pinned' || fIds.length) return;         // skip the pinned view + narrative deep-links
  try{
    const r=await afetch(`/api/items?days=${fWin}`);
    if(!r.ok) return;
    const fresh=await r.json(); if(!Array.isArray(fresh)) return;
    const cur=new Set(ITEMS.map(i=>i.id));
    const added=fresh.filter(i=>!cur.has(i.id));
    if(!added.length){ hideNewPill(); return; }
    const visible=added.filter(pass).length;         // only new cards this filter would SHOW
    STAGED=fresh;
    if(!visible){ hideNewPill(); return; }            // new items exist, just not in this view
    if(window.scrollY < 120) applyStaged();           // reader at the top → refresh in place
    else showNewPill(visible);                        // reader scrolled down → offer the tap
  }catch(e){}
}

/* ── shareable branded snapshot (canvas → PNG, no libraries) ──
   Renders a clean, always-light branded image (best for WhatsApp/Slack) of the
   reputation pulse or a single card, then offers Web Share (with the file) or a
   download. Arabic headlines are drawn right-to-left. */
const SNAPW=1080, DPR=2;
function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function wrapText(c,text,maxW){ const rtl=/[؀-ۿ]/.test(text); const words=String(text).split(/\s+/); const lines=[]; let cur=''; for(const w of words){ const t=cur?cur+' '+w:w; if(c.measureText(t).width>maxW&&cur){ lines.push(cur); cur=w; } else cur=t; } if(cur) lines.push(cur); return {lines,rtl}; }
function newCanvas(h){ const cv=document.createElement('canvas'); cv.width=SNAPW*DPR; cv.height=h*DPR; const c=cv.getContext('2d'); c.scale(DPR,DPR); c.textBaseline='alphabetic'; return {cv,c}; }
function snapHeader(c,title){
  c.fillStyle='#e60000'; c.fillRect(0,0,SNAPW,150);
  c.fillStyle='#fff'; roundRect(c,48,44,64,64,16); c.fill();
  c.fillStyle='#e60000'; c.font='800 26px '+SANS; c.textAlign='left'; c.fillText('PR',62,86);
  c.fillStyle='#fff'; c.font='800 34px '+SANS; c.fillText(title,132,78);
  c.fillStyle='rgba(255,255,255,.85)'; c.font='600 15px '+SANS;
  const d=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'Africa/Cairo'}).toUpperCase();
  c.fillText('BRAND & REPUTATION  ·  '+d+'  ·  VODAFONE EGYPT',132,108);
}
function snapFooter(c,y){ c.fillStyle='#9aa2ad'; c.font='600 15px '+SANS; c.textAlign='left'; c.fillText('PR Radar · Vodafone Egypt — Brand & Reputation monitor',48,y); }
const SANS='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
const SENTC={negative:'#e60000',positive:'#0f9d58',neutral:'#5b6675'};

function snapshotPulse(){

  const vneg=vr.filter(i=>sentOf(i)==='negative').length, vpos=vr.filter(i=>sentOf(i)==='positive').length;
  const H=560; const {cv,c}=newCanvas(H);
  c.fillStyle='#faf8f7'; c.fillRect(0,0,SNAPW,H); snapHeader(c,'Reputation Pulse');
  // Vodafone hero
  c.fillStyle='#fff'; roundRect(c,48,186,SNAPW-96,150,20); c.fill();
  c.fillStyle='#e60000'; roundRect(c,72,210,84,84,18); c.fill();
  c.fillStyle='#fff'; c.font='800 44px '+SANS; c.textAlign='center'; c.fillText('V',114,270); c.textAlign='left';
  c.fillStyle='#16191f'; c.font='800 26px '+SANS; c.fillText('Vodafone',176,244);
  c.font='800 60px '+SANS; const numW=c.measureText(String(vneg)).width;   // measure at the BIG size, before switching fonts
  c.fillStyle=vneg?'#b60009':'#0f9d58'; c.fillText(String(vneg),176,308);
  c.fillStyle='#6c7480'; c.font='600 18px '+SANS; c.fillText(`negative of ${vr.length} tracked`,176+numW+18,299);
  // competitor row

  for(const b of ['Orange','WE','e&']){ const rows=ITEMS.filter(i=>(i.brand||'')===b); const pos=rows.filter(i=>sentOf(i)==='positive').length;
    y+=34; c.fillStyle=BRAND_COLOR[b]; roundRect(c,48,y-16,12,12,3); c.fill();

function snapshotCard(id){
  const it=ITEMS.find(x=>x.id===id); if(!it) return; const sent=sentOf(it); const spread=spreadOf(it);
  // measure headline height first
  const tmp=newCanvas(10).c; tmp.font='800 34px '+SANS; const {lines,rtl}=wrapText(tmp,it.headline||'',SNAPW-96);
  const H=320+lines.length*46+(it.summary?70:0); const {cv,c}=newCanvas(H);

  const brand=it.brand||'Market';
  c.font='800 18px '+SANS; const bw=c.measureText(brand).width+28; c.fillStyle=BRAND_COLOR[it.brand]||'#6c7480'; roundRect(c,80,y-26,bw,34,9); c.fill();
  c.fillStyle='#fff'; c.fillText(brand,94,y-2);
  c.fillStyle=SENTC[sent]; c.font='800 18px '+SANS; c.fillText(sentLabel(it).toUpperCase(),80+bw+16,y-2);
  if(spread>1){ c.fillStyle='#6c7480'; c.font='700 17px '+SANS; c.textAlign='right'; c.fillText(`◱ ${spread} outlets`,SNAPW-80,y-2); c.textAlign='left'; }
  // headline (RTL-aware)
  y+=54; c.fillStyle='#16191f'; c.font='800 34px '+SANS;
  if(rtl){ c.textAlign='right'; for(const ln of lines){ c.fillText(ln,SNAPW-80,y); y+=46; } c.textAlign='left'; }
  else { for(const ln of lines){ c.fillText(ln,80,y); y+=46; } }
  // action line
  const act=actionLine(it);
  if(act){ y+=8; c.fillStyle='#b60009'; c.font='700 19px '+SANS; const aw=wrapText(c,'→ '+act,SNAPW-160); const artl=/[؀-ۿ]/.test(act);
    if(artl){ c.textAlign='right'; for(const ln of aw.lines){ c.fillText(ln,SNAPW-80,y); y+=28; } c.textAlign='left'; }
    else for(const ln of aw.lines){ c.fillText(ln,80,y); y+=28; } }
  snapFooter(c,H-30);
  openSnap(cv,'pr-radar-card.png','PR Radar — '+(it.brand||'coverage'));
}

let SNAP_URL=null, SNAP_NAME='snapshot.png';
function openSnap(cv,filename,shareText){
  SNAP_NAME=filename;
  cv.toBlob(async(blob)=>{
    if(SNAP_URL) URL.revokeObjectURL(SNAP_URL); SNAP_URL=URL.createObjectURL(blob);
    $('#snapImg').src=SNAP_URL; $('#snap').classList.add('on');
    const file=new File([blob],filename,{type:'image/png'});
    const canShare=navigator.canShare&&navigator.canShare({files:[file]});
    const dl=$('#snapDl'); dl.textContent=canShare?'↗ Share':'↓ Save image';
    dl.onclick=async()=>{ if(canShare){ try{ await navigator.share({files:[file],text:shareText}); return; }catch(e){} } const a=document.createElement('a'); a.href=SNAP_URL; a.download=filename; a.click(); };
  },'image/png');
}
$('#snapCl').onclick=()=>$('#snap').classList.remove('on');
$('#snap').onclick=e=>{ if(e.target.id==='snap') $('#snap').classList.remove('on'); };

buildFilters();
renderAccount();
if(session) loadMe();
load();
// Live auto-refresh: poll while the tab is open, and refresh promptly on return.
$('#newPill').onclick=applyStaged;
setInterval(checkNew, AUTO_REFRESH_MS);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkNew(); });
</script>
