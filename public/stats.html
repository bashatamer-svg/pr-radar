<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PR Radar — Trends</title>
<meta name="description" content="Share-of-voice, sentiment and coverage trends for Vodafone Egypt PR monitoring.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f1f2f5">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PR Radar">
<meta property="og:title" content="PR Radar — Trends">
<meta property="og:description" content="Daily press &amp; media monitor for Vodafone Egypt — coverage, sentiment and share of voice, classified and briefed for the PR &amp; Communications team.">
<meta property="og:image" content="/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/og-card.png">
<style>
  /* Same design tokens as the board (index.html) — one visual system. */
  :root{
    --red:#e60000; --red-deep:#b60009; --red-glow:rgba(230,0,0,.28);
    --bg:#f1f2f5; --card:#ffffff; --raise:#f6f7f9;
    --ink:#16191f; --ink-2:#3b434e; --muted:#6c7480; --faint:#9aa2ad; --hair:#e7e9ee; --hair-2:#eef0f3;
    --neg:#e60000; --neg-bg:#fff2f0; --neg-line:#ffd4cf;
    --pos:#0f9d58; --pos-bg:#edfaf1;
    --neu:#5b6675; --neu-bg:#f0f3f7;
    --amber:#d97706;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --mh:56px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  a{color:var(--red)}
  .wrap{max-width:840px;margin:0 auto;min-height:100vh;padding-bottom:70px}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}

  .top{position:sticky;top:0;z-index:40;height:var(--mh);display:flex;align-items:center;gap:11px;padding:0 16px;
       background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border-bottom:1px solid var(--hair)}
  .back{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--ink);
        color:#fff;text-decoration:none;font-size:15px;font-weight:800}
  .ttl{flex:1;min-width:0}
  .ttl .h1{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .ttl .sub{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:500}
  .reports{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:var(--red);
        text-decoration:none;border:1.5px solid var(--red);border-radius:999px;padding:6px 11px;white-space:nowrap}
  .reports:hover{background:var(--red);color:#fff}
  .clock{flex:none;text-align:right;background:var(--raise);border:1px solid var(--hair);border-radius:9px;padding:5px 9px}
  .clock .t{font-family:var(--mono);font-size:12px;font-weight:700;line-height:1.1}
  .clock .d{font-family:var(--mono);font-size:8px;color:var(--faint);letter-spacing:.08em}
  /* The same call the board makes at the same width: the clock goes rather than
     letting `.ttl` — the only flex:1 child among flex:none siblings — absorb the
     shortfall. Without it this header wanted 342px at 320px, panning the whole
     page by 22px and truncating the word "Trends" itself. */
  @media(max-width:560px){ .top .clock{display:none} }

  /* One filter row above everything it scopes (never per-chart). */
  .bar2{position:sticky;top:var(--mh);z-index:30;background:rgba(241,242,245,.9);backdrop-filter:blur(12px);
        border-bottom:1px solid var(--hair);padding:11px 16px 10px}
  .frow{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;--edge:var(--bg)}
  /* SCROLL HINT — a row that scrolls sideways with a hidden scrollbar gives no
     sign that there is more. Seven admin tabs on a phone showed four, and the
     other three simply did not exist as far as the reader was concerned.
     Pure CSS, no JS and no extra markup: two `local` gradients scroll WITH the
     content and mask two `scroll`-attached shadows, so a shadow appears only on
     the side that has more to show and disappears when you reach that end.
     `--edge` is the row's own background colour — the mask has to match what is
     behind it, or the trick shows its seams. */
  .scrollhint{
    background:
      linear-gradient(90deg, var(--edge) 40%, rgba(255,255,255,0)) left center / 28px 100% no-repeat local,
      linear-gradient(-90deg, var(--edge) 40%, rgba(255,255,255,0)) right center / 28px 100% no-repeat local,
      radial-gradient(farthest-side at 0 50%, rgba(20,23,28,.16), rgba(20,23,28,0)) left center / 12px 100% no-repeat scroll,
      radial-gradient(farthest-side at 100% 50%, rgba(20,23,28,.16), rgba(20,23,28,0)) right center / 12px 100% no-repeat scroll;
  }

  .frow::-webkit-scrollbar{display:none}
  .flabel{flex:none;align-self:center;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding-right:2px}
  .chip{flex:none;cursor:pointer;border:1px solid var(--hair);background:var(--card);color:var(--ink-2);
        font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:11px;white-space:nowrap;transition:all .12s}
  .chip:hover{border-color:var(--faint)}
  .chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

  .content{padding:14px 16px 0}
  .empty,.gate{text-align:center;color:var(--muted);padding:64px 26px;font-size:14px;line-height:1.7}
  .gate code{background:var(--card);border:1px solid var(--hair);padding:2px 8px;border-radius:6px;color:var(--ink);font-family:var(--mono)}

  /* KPI stat tiles */
  .khead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin:2px 2px 9px}
  .khead .ct{font-size:14px;font-weight:800;letter-spacing:-.01em}
  .khead .cs{font-size:11px;color:var(--faint);font-weight:500}
  .khead .xp{cursor:pointer;border:1px solid var(--hair);background:var(--card);color:var(--muted);
             font-family:var(--sans);font-size:11px;font-weight:700;padding:5px 8px;border-radius:9px;white-space:nowrap}
  .khead .xp:hover{border-color:var(--red);color:var(--red)}
  /* "So what?" — the executive strip. Reads as prose, not as a chart. */
  .exec{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:14px 16px;margin:12px 0}
  .exhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;font-size:12px;font-weight:800;
          letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
  .exsub{font-size:10.5px;font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--faint)}
  .exlist{list-style:none;margin:9px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
  .exrow a,.exrow>span{display:flex;align-items:flex-start;gap:9px;padding:6px 6px;border-radius:9px;
        color:var(--ink-2);text-decoration:none;font-size:13.5px;line-height:1.5}
  .exrow a:hover{background:var(--neu-bg);color:var(--ink)}
  .exrow a:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
  .exdot{flex:none;width:7px;height:7px;border-radius:50%;margin-top:7px;background:var(--faint)}
  .exdot.bad{background:var(--red)} .exdot.good{background:var(--pos)} .exdot.flat{background:var(--muted)}
  .exempty{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.5}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  @media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:12px 13px;animation:rise .5s both}
  .kpi .kl{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
  .kpi .kv{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-top:5px}
  .kpi .kv.neg{color:var(--red-deep)}
  .kpi .ks{font-size:10.5px;color:var(--faint);margin-top:3px;font-weight:600}
  a.kpi{text-decoration:none;color:inherit;display:block;cursor:pointer;transition:border-color .12s,box-shadow .12s}
  a.kpi:hover{border-color:var(--red);box-shadow:0 3px 14px -8px var(--red-glow,rgba(230,0,0,.28))}

  /* chart cards */
  .cardc{background:var(--card);border:1px solid var(--hair);border-radius:18px;padding:15px 16px;margin:12px 0;
         box-shadow:0 2px 12px -8px rgba(20,23,28,.18);animation:rise .5s both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .chead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .chead .cacts{margin-left:auto;display:flex;gap:6px;flex:none}
  .chead .ct{font-size:14px;font-weight:800;letter-spacing:-.01em}
  .chead .cs{font-size:11px;color:var(--faint);font-weight:500}
  .chead .tgl,.chead .xp{cursor:pointer;border:1px solid var(--hair);background:var(--card);color:var(--muted);
              font-family:var(--sans);font-size:11px;font-weight:700;padding:5px 10px;border-radius:9px;white-space:nowrap}
  .chead .xp{padding:5px 8px}
  .chead .tgl:hover,.chead .xp:hover{border-color:var(--red);color:var(--red)}
  .legend{display:flex;flex-wrap:wrap;gap:5px 14px;margin:10px 0 2px;font-size:11.5px;color:var(--ink-2);font-weight:600}
  .legend .li{display:inline-flex;align-items:center;gap:6px}
  a.li{text-decoration:none;color:inherit;cursor:pointer;border-radius:6px;padding:2px 5px;margin:-2px -1px}
  a.li:hover{background:var(--raise);color:var(--red)}
  .legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
  .legend .sw.line{height:3px;border-radius:2px;width:14px}
  /* A long-press anywhere on a chart selected its SVG text and raised iOS's
     Copy / Find Selection / Look Up bar straight over the graph, with a blue
     wash across the plot (live, 3 Aug). Charts hold nothing worth selecting —
     the numbers live in ⊞ Table and the ⤓ XLS / ⤓ PDF exports — so the
     selection could only ever obscure the thing you were trying to read.
     The TABLE view keeps text selection on purpose: it IS the copyable
     surface, and it is the one place a reader has a reason to drag over. */
  .cardc,.kpis{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .cardc .tbl{-webkit-user-select:text;user-select:text}
  .cbody{margin-top:6px}
  .cbody svg{display:block;width:100%}
  .cbody.faded{opacity:.45;transition:opacity .15s}
  svg text{font-family:var(--sans)}
  .axis{font-size:10px;fill:var(--muted)}
  .gline{stroke:var(--hair-2);stroke-width:1}
  .baseline{stroke:var(--hair);stroke-width:1}

  /* leaderboard-style rows (categories / outlets / authors) */
  .rows{margin-top:8px}
  .lrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--hair-2)}
  a.lrow{text-decoration:none;color:inherit;cursor:pointer;padding-left:8px;padding-right:6px;margin:0 -8px;border-radius:8px;transition:background .12s}
  a.lrow:hover{background:var(--raise)}
  a.lrow:hover .nm{color:var(--red)}
  a.lrow::after{content:"›";flex:none;color:var(--faint);font-weight:800;font-size:15px;line-height:1}
  a.lrow:hover::after{color:var(--red)}
  .lrow:first-child{border-top:none}
  .lrow .nm{flex:0 1 34%;min-width:0;font-size:12.5px;font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lrow .nm .sub{display:block;font-size:10px;color:var(--faint);font-weight:500;overflow:hidden;text-overflow:ellipsis}
  .lrow .bar{flex:1;height:12px;border-radius:4px;background:var(--hair-2);overflow:hidden;display:flex}
  .lrow .bar i{display:block;height:100%}
  .lrow .val{flex:none;min-width:64px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--ink-2);white-space:nowrap}
  .lrow .val b.neg{color:var(--red-deep)}
  .lrow .spark{flex:none;width:72px}
  /* Narrative rows: names are whole (often Arabic) sentences, not short labels —
     wrap to two lines with correct bidi instead of a 34% nowrap ellipsis. */
  .lrow.narr .nm{flex:1 1 44%;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35;unicode-bidi:plaintext}
  .lrow.narr .nm .sub{white-space:nowrap;unicode-bidi:plaintext}
  /* A phone cannot fit name + spark + bar + value on one line, and `.nm` was the
     row's ONLY shrinkable child (`.val` is flex:none at ~192px of nowrap text,
     `.spark` a fixed 72px, the chevron flex:none) — so the NAME absorbed the
     whole shortfall. At 390px an outlet rendered as "ك.." (17px against the
     168px it wanted) and a journalist as "م..", their outlet sub-line collapsed
     with them, and the sentiment bar was squeezed to 0px: the two leaderboards
     showed nothing but numbers, which is the entire point of the cards gone.
     0px at 360, 57px at 430 — every phone, not an edge case.
     So the row STACKS below 560px: the name owns the first line at full width
     (wrapping, never ellipsised to a stub), the bar and the numbers sit beneath
     it, and the sparkline goes — this file already dropped the spark here for
     narrative rows for exactly this reason, so the rule now covers every row
     instead of one kind. Pinned by render-leaderboard-mobile. */
  @media(max-width:560px){
    .lrow{flex-wrap:wrap;row-gap:5px}
    .lrow .nm{flex:1 1 100%;white-space:normal;overflow:visible;overflow-wrap:anywhere}
    .lrow.narr .nm{flex:1 1 100%;overflow:hidden}   /* keeps its 2-line clamp */
    .lrow .spark{display:none}
    .lrow .bar{flex:1 1 70px}
  }
  .badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.04em;padding:2px 6px;border-radius:5px;
         background:var(--neg-bg);color:var(--red-deep);box-shadow:inset 0 0 0 1px var(--neg-line);vertical-align:1px;margin-left:5px}
  .badge.lean{background:#fff5e6;color:var(--amber);box-shadow:inset 0 0 0 1px #f5dcb0}
  .badge.rise{background:#e9f1fb;color:#1c5cab;box-shadow:inset 0 0 0 1px #cfe0f5}

  /* table view — the accessible twin of every chart */
  /* leaderboard pager */
  .pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;padding-top:9px;border-top:1px solid var(--hair-2)}
  .pager .pg{cursor:pointer;border:1px solid var(--hair);background:var(--card);color:var(--ink-2);font-family:var(--sans);
             font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:9px;white-space:nowrap;transition:all .12s}
  .pager .pg:hover:not(:disabled){border-color:var(--red);color:var(--red)}
  .pager .pg:disabled{opacity:.35;cursor:default}
  .pager .pgn{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:600;min-width:96px;text-align:center}
  .tbl{display:none;margin-top:8px;overflow-x:auto}
  .tbl.on{display:block}
  .cbody.off{display:none}
  .tbl table{border-collapse:collapse;width:100%;font-size:11.5px}
  .tbl th,.tbl td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--hair-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .tbl th{color:var(--muted);font-weight:700;font-size:10px;letter-spacing:.04em;text-transform:uppercase}
  .tbl th:first-child,.tbl td:first-child{text-align:left}
  .tbl td:first-child{color:var(--ink-2);font-weight:600}

  /* shared tooltip */
  .tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;
       padding:8px 11px;font-size:11.5px;line-height:1.55;box-shadow:0 8px 24px -8px rgba(0,0,0,.4);
       opacity:0;transition:opacity .1s;max-width:230px}
  .tip.on{opacity:1}
  .tip .th{font-weight:800;font-size:10.5px;letter-spacing:.03em;margin-bottom:3px;color:#cfd4da}
  .tip .tr{display:flex;align-items:center;gap:7px;white-space:nowrap}
  .tip .tk{width:12px;height:3px;border-radius:2px;flex:none}
  .tip .tv{font-weight:800;margin-left:auto;padding-left:12px;font-variant-numeric:tabular-nums}

  .footnote{margin:16px 2px 0;font-size:10.5px;color:var(--faint);line-height:1.6}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" id="backLink" href="/" title="Back to the board" aria-label="Back to the board">‹</a>
    <div class="ttl"><div class="h1">Trends</div><div class="sub">PR Radar by <b>Regulatory Affairs</b> · Vodafone Egypt</div></div>
    <a class="reports" href="/reports" title="Reports — pick any date range, export as PDF or Word">📄 Reports</a>
    <div class="clock"><div class="t" id="clockTime">—</div><div class="d" id="clockDate">—</div></div>
  </header>

  <div class="bar2">
    <div class="frow scrollhint" id="winRow"></div>
  </div>

  <main class="content" id="content"><div class="empty">Loading trends…</div></main>
</div>

<div class="tip" id="tip" role="status" aria-hidden="true"></div>

<script src="/assets/session.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=(s)=>String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

const params=new URLSearchParams(location.search);
// Session + afetch: /assets/session.js (shared by every page).

// Brand series — FIXED order and entity-bound colors (never re-assigned when a
// series is empty). e& uses #00897d for chart marks: the brand's #00857b sits a
// hair under the OKLCH chroma floor (0.097 < 0.10) and reads gray at mark size;
// this is the nearest step of the same teal that passes the palette validator.
// Order V,O,WE,e& clears CVD ΔE (worst pair 13.9) and normal-vision (16.8)
// checks all-pairs on white. Orange sits at 2.63:1 contrast — relieved by the
// per-chart table view (⊞) and the always-on legend.
const SERIES=['Vodafone','Orange','WE','e&','Market'];
const CHART={Vodafone:'#e60000',Orange:'#ff7900',WE:'#7b1fa2','e&':'#00897d',Market:'#9aa2ad'};
const NEG='#e60000', POS='#0f9d58', NEU='#d3dae1';   // sentiment polarity (board's own)

let DATA=null; let fDays=Number(localStorage.getItem('pr_stats_days'))||30;
// Leaderboard paging, per card. Reset on every load() so a window change can't
// leave you on page 4 of a list that now has two pages.
const PAGE_SIZE=15;
let pageOf={outlet:0,author:0};
// Click a Trends row → land on the board showing exactly those cards. Board
// windows are 1/2/7/30 days, so clamp the stats window to the nearest.
const boardWin=()=>{ const d=fDays||30; return d<=1?1:d<=2?2:d<=7?7:30; };
const boardLink=(key,val)=>`/?${key}=${encodeURIComponent(val)}&win=${boardWin()}`;

function clock(){
  const now=new Date();
  $('#clockDate').textContent=now.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',timeZone:'Africa/Cairo'}).toUpperCase();
  $('#clockTime').textContent=now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Cairo'})+' CAI';
}
clock(); setInterval(clock,30000);

/* ── shared tooltip (DOM built with textContent — labels are untrusted data) ── */
const tip=$('#tip');
function tipShow(x,y,head,rows){
  tip.replaceChildren();
  const h=document.createElement('div'); h.className='th'; h.textContent=head; tip.appendChild(h);
  for(const r of rows){
    const d=document.createElement('div'); d.className='tr';
    if(r.color){ const k=document.createElement('span'); k.className='tk'; k.style.background=r.color; d.appendChild(k); }
    const l=document.createElement('span'); l.textContent=r.label; d.appendChild(l);
    const v=document.createElement('span'); v.className='tv'; v.textContent=r.value; d.appendChild(v);
    tip.appendChild(d);
  }
  tip.classList.add('on'); tip.setAttribute('aria-hidden','false');
  const w=tip.offsetWidth,h2=tip.offsetHeight;
  tip.style.left=Math.min(Math.max(8,x+14),innerWidth-w-8)+'px';
  tip.style.top=Math.min(Math.max(8,y-h2-12),innerHeight-h2-8)+'px';
}
function tipHide(){ tip.classList.remove('on'); tip.setAttribute('aria-hidden','true'); }

/* ── small helpers ── */
const fmtDay=(d)=>{ const t=new Date(d+'T12:00:00'); return t.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); };
const niceMax=(m)=>{ if(m<=5)return 5; const p=Math.pow(10,Math.floor(Math.log10(m))); const u=m/p; const s=u<=1?1:u<=2?2:u<=5?5:10; return s*p; };
const pct=(n,d)=>d?Math.round(n/d*100):0;
// 4px-rounded data-end at the top, square at the baseline (mark spec).
function topRect(x,y,w,h,r){ r=Math.min(r,h,w/2); if(h<=0||w<=0)return''; return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`; }

function legendHtml(names,shape){
  const BRANDS=['Vodafone','Orange','WE','e&'];
  return `<div class="legend">${names.map(n=>{
    const inner=`<span class="sw ${shape==='line'?'line':''}" style="background:${CHART[n]}"></span>${esc(n)}`;
    return BRANDS.includes(n)?`<a class="li" href="${boardLink('brand',n)}" title="Show ${esc(n)} cards on the board">${inner}</a>`:`<span class="li">${inner}</span>`;
  }).join('')}</div>`;
}

/* ============================================================
   Chart builders — every chart returns {svg,bind,table}
   ============================================================ */

/* Share of voice — stacked columns per day, fixed stack order, 2px surface
   gaps between touching segments, rounded top on the stack's data-end. */
function sovChart(el){
  const {days,sov}=DATA;
  const active=SERIES.filter(b=>sov[b].mentions.some(v=>v>0));
  const W=el.clientWidth||600, plotH=190, padL=30, padR=6, padT=8, axisH=22, H=plotH+padT+axisH;
  const n=days.length, plotW=W-padL-padR;
  const band=plotW/n, bw=Math.min(24,Math.max(3,band-2));
  const totals=days.map((_,i)=>active.reduce((s,b)=>s+sov[b].mentions[i],0));
  const yMax=niceMax(Math.max(1,...totals));
  const y=v=>padT+plotH-(v/yMax*plotH);
  let g='';
  const ticks=[0,yMax/2,yMax].map(v=>Math.round(v));
  for(const t of ticks) g+=`<line class="gline" x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}"></line><text class="axis" x="${padL-5}" y="${y(t)+3}" text-anchor="end">${t}</text>`;
  const step=Math.max(1,Math.ceil(n/6));
  days.forEach((d,i)=>{ if(i%step===0||i===n-1) g+=`<text class="axis" x="${padL+i*band+band/2}" y="${H-6}" text-anchor="middle">${esc(fmtDay(d))}</text>`; });
  let bars='', hits='';
  days.forEach((d,i)=>{
    const x=padL+i*band+(band-bw)/2;
    let acc=0; const segs=[];
    for(const b of active){ const v=sov[b].mentions[i]; if(v>0){ segs.push([b,acc,v]); acc+=v; } }
    segs.forEach(([b,base,v],si)=>{
      const top=si===segs.length-1;
      // 2px surface gap at every internal boundary: each non-top segment's top
      // edge steps down 2px (the gap is the white card showing through). The
      // top segment keeps the 4px rounded data-end; the baseline stays square.
      const yTop=y(base+v)+(top?0:2);
      const h=Math.max(.75,y(base)-yTop);
      bars+= top
        ? `<path d="${topRect(x,yTop,bw,h,4)}" fill="${CHART[b]}"></path>`
        : `<rect x="${x}" y="${yTop}" width="${bw}" height="${h}" fill="${CHART[b]}"></rect>`;
    });
    hits+=`<rect data-i="${i}" x="${padL+i*band}" y="${padT}" width="${band}" height="${plotH}" fill="transparent"></rect>`;
  });
  const svg=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Mentions per brand per day">
    ${g}<line class="baseline" x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}"></line>${bars}<g class="hits">${hits}</g></svg>`;
  const bind=(root)=>{
    root.querySelectorAll('.hits rect').forEach(r=>{
      const i=Number(r.dataset.i);
      const show=(e)=>{ const pt=e.touches?e.touches[0]:e;
        tipShow(pt.clientX,pt.clientY,fmtDay(days[i])+' — '+totals[i]+' item'+(totals[i]===1?'':'s'),
          active.map(b=>({color:CHART[b],label:b,value:sov[b].mentions[i]+(sov[b].negatives[i]?` (${sov[b].negatives[i]} negative)`:'')})));
      };
      r.addEventListener('pointermove',show); r.addEventListener('pointerdown',show);
      r.addEventListener('pointerleave',tipHide);
    });
  };
  const table=()=>{
    let h='<table><caption class="axis" style="text-align:left;padding:2px 0 6px;color:var(--faint)">Mentions per brand per day (negative stories in parentheses)</caption><thead><tr><th scope="col">Day</th>'+active.map(b=>`<th scope="col">${esc(b)}</th>`).join('')+'<th scope="col">Total</th></tr></thead><tbody>';
    days.forEach((d,i)=>{ if(!totals[i]) return;
      h+=`<tr><td>${esc(fmtDay(d))}</td>`+active.map(b=>{const m=sov[b].mentions[i],x=sov[b].negatives[i];return `<td>${m}${x?` (${x})`:''}</td>`;}).join('')+`<td><b>${totals[i]}</b></td></tr>`; });
    return h+'</tbody></table>';
  };
  return {legend:legendHtml(active,'rect'),svg,bind,table};
}

/* Negative coverage per day — 2px brand-colored lines, crosshair tooltip.
   Every series counts items scored negative FOR THE BRAND THEY ARE ABOUT, so a
   rival's line rises when the rival is having a bad week. Same scale for all
   four brands — nothing here is inverted. */
function negChart(el){
  const {days,sov}=DATA;
  const active=SERIES.filter(b=>b!=='Market'&&sov[b].negatives.some(v=>v>0));
  const all=active.length?active:['Vodafone'];
  const W=el.clientWidth||600, plotH=150, padL=30, padR=8, padT=8, axisH=22, H=plotH+padT+axisH;
  const n=days.length, plotW=W-padL-padR;
  const xs=i=>padL+(n===1?plotW/2:i/(n-1)*plotW);
  const yMax=niceMax(Math.max(1,...all.flatMap(b=>sov[b].negatives)));
  const y=v=>padT+plotH-(v/yMax*plotH);
  let g='';
  for(const t of [0,yMax/2,yMax].map(v=>Math.round(v))) g+=`<line class="gline" x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}"></line><text class="axis" x="${padL-5}" y="${y(t)+3}" text-anchor="end">${t}</text>`;
  const step=Math.max(1,Math.ceil(n/6));
  // last tick anchors right so it never clips; ticks that would crowd it are skipped
  days.forEach((d,i)=>{ if(i===n-1||(i%step===0&&xs(i)<W-padR-40)) g+=`<text class="axis" x="${xs(i)}" y="${H-6}" text-anchor="${i===n-1?'end':'middle'}">${esc(fmtDay(d))}</text>`; });
  let lines='';
  for(const b of all){
    const pts=days.map((_,i)=>`${xs(i).toFixed(1)},${y(sov[b].negatives[i]).toFixed(1)}`).join(' ');
    lines+=`<polyline points="${pts}" fill="none" stroke="${CHART[b]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>`;
  }
  const svg=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Negative coverage per brand per day">
    ${g}<line class="baseline" x1="${padL}" x2="${W-padR}" y1="${y(0)}" y2="${y(0)}"></line>${lines}
    <line class="xh" x1="0" x2="0" y1="${padT}" y2="${padT+plotH}" stroke="var(--faint)" stroke-width="1" opacity="0"></line>
    <g class="dots"></g>
    <rect class="hitall" x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="transparent"></rect></svg>`;
  const bind=(root)=>{
    const svgEl=root.querySelector('svg'), xh=root.querySelector('.xh'), dots=root.querySelector('.dots');
    const move=(e)=>{
      const box=svgEl.getBoundingClientRect(); const sc=box.width/W;
      const pt=e.touches?e.touches[0]:e;
      const px=(pt.clientX-box.left)/sc;
      const i=Math.max(0,Math.min(n-1,Math.round((px-padL)/(plotW||1)*(n-1))));
      xh.setAttribute('x1',xs(i)); xh.setAttribute('x2',xs(i)); xh.setAttribute('opacity','1');
      // hover markers: ≥8px dot with a 2px surface ring so they read over lines
      dots.replaceChildren(...all.map(b=>{ const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
        c.setAttribute('cx',xs(i)); c.setAttribute('cy',y(sov[b].negatives[i])); c.setAttribute('r','4.5');
        c.setAttribute('fill',CHART[b]); c.setAttribute('stroke','var(--card)'); c.setAttribute('stroke-width','2'); return c; }));
      tipShow(pt.clientX,pt.clientY,fmtDay(days[i])+' — negative',
        all.map(b=>({color:CHART[b],label:b,value:String(sov[b].negatives[i])})));
    };
    const leave=()=>{ xh.setAttribute('opacity','0'); dots.replaceChildren(); tipHide(); };
    const hit=root.querySelector('.hitall');
    hit.addEventListener('pointermove',move); hit.addEventListener('pointerdown',move);
    hit.addEventListener('pointerleave',leave);
  };
  const table=()=>{
    let h='<table><thead><tr><th scope="col">Day</th>'+all.map(b=>`<th scope="col">${esc(b)}</th>`).join('')+'</tr></thead><tbody>';
    days.forEach((d,i)=>{ const tot=all.reduce((s,b)=>s+sov[b].negatives[i],0); if(!tot) return;
      h+=`<tr><td>${esc(fmtDay(d))}</td>`+all.map(b=>`<td>${sov[b].negatives[i]}</td>`).join('')+'</tr>'; });
    return h+'</tbody></table>';
  };
  return {legend:legendHtml(all,'line'),svg,bind,table};
}

/* Sentiment by brand — diverging stacked bars centered on neutral (ordered
   scale → diverging form; side-of-center + labels carry polarity, not hue alone). */
function sentimentChart(el){
  const s=DATA.sentimentByBrand;
  const rows=SERIES.filter(b=>s[b]&&s[b].total>0);
  const W=el.clientWidth||600, rowH=30, gap=8, padL=70, padR=34, H=rows.length*(rowH+gap)+6;
  const cx=padL+(W-padL-padR)/2;
  const maxSide=Math.max(1,...rows.map(b=>Math.max(s[b].negative+s[b].neutral/2,s[b].positive+s[b].neutral/2)));
  const sc=(W-padL-padR)/2/maxSide;
  let g='';
  rows.forEach((b,ri)=>{
    const yy=6+ri*(rowH+gap), h=14, ym=yy+(rowH-h)/2;
    const d=s[b], nh=d.neutral/2*sc;
    g+=`<text class="axis" x="${padL-8}" y="${ym+h/2+3.5}" text-anchor="end" style="font-weight:700;fill:var(--ink-2);font-size:11px">${esc(b)}</text>`;
    if(d.neutral>0) g+=`<rect x="${cx-nh}" y="${ym}" width="${nh*2}" height="${h}" fill="${NEU}" rx="2"></rect>`;
    if(d.negative>0) g+=`<rect x="${cx-nh-d.negative*sc}" y="${ym}" width="${Math.max(1,d.negative*sc-1)}" height="${h}" fill="${NEG}" rx="2"></rect>`;
    if(d.positive>0) g+=`<rect x="${cx+nh+1}" y="${ym}" width="${Math.max(1,d.positive*sc-1)}" height="${h}" fill="${POS}" rx="2"></rect>`;
    // direct labels at both data-ends: values are readable without color.
    // A long bar's outside label would collide with the brand name / edge —
    // measure and fall inside the bar (white on the fill) when it won't fit.
    if(d.negative>0){
      const bx=cx-nh-d.negative*sc, fits=bx-5-14>=padL;
      g+= fits
        ? `<text x="${bx-5}" y="${ym+h/2+3.5}" text-anchor="end" style="font-size:10.5px;font-weight:800;fill:var(--red-deep)">${d.negative}</text>`
        : `<text x="${bx+5}" y="${ym+h/2+3.5}" style="font-size:10.5px;font-weight:800;fill:#fff">${d.negative}</text>`;
    }
    if(d.positive>0){
      const bx=cx+nh+d.positive*sc, fits=bx+5+14<=W;
      g+= fits
        ? `<text x="${bx+5}" y="${ym+h/2+3.5}" style="font-size:10.5px;font-weight:800;fill:${POS}">${d.positive}</text>`
        : `<text x="${bx-5}" y="${ym+h/2+3.5}" text-anchor="end" style="font-size:10.5px;font-weight:800;fill:#fff">${d.positive}</text>`;
    }
    g+=`<rect class="hit" data-b="${esc(b)}" x="0" y="${yy}" width="${W}" height="${rowH}" fill="transparent"></rect>`;
  });
  g+=`<line x1="${cx}" x2="${cx}" y1="0" y2="${H}" stroke="var(--hair)" stroke-width="1"></line>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Sentiment split per brand">${g}</svg>`;
  const bind=(root)=>{
    root.querySelectorAll('.hit').forEach(r=>{
      const b=r.dataset.b, d=s[b];
      const show=(e)=>{ const pt=e.touches?e.touches[0]:e;
        tipShow(pt.clientX,pt.clientY,b+' — '+d.total+' item'+(d.total===1?'':'s'),[
          {color:NEG,label:'Negative',value:String(d.negative)},
          {color:NEU,label:'Neutral',value:String(d.neutral)},
          {color:POS,label:'Positive',value:String(d.positive)},
        ]); };
      r.addEventListener('pointermove',show); r.addEventListener('pointerdown',show);
      r.addEventListener('pointerleave',tipHide);
    });
  };
  const table=()=>{
    let h='<table><thead><tr><th scope="col">Brand</th><th scope="col">Negative</th><th scope="col">Neutral</th><th scope="col">Positive</th><th scope="col">Total</th></tr></thead><tbody>';
    rows.forEach(b=>{ const d=s[b]; h+=`<tr><td>${esc(b)}</td><td>${d.negative}</td><td>${d.neutral}</td><td>${d.positive}</td><td><b>${d.total}</b></td></tr>`; });
    return h+'</tbody></table>';
  };
  return {legend:`<div class="legend"><a class="li" href="${boardLink('sent','negative')}" title="Show the negative cards"><span class="sw" style="background:${NEG}"></span>Negative</a><a class="li" href="${boardLink('sent','neutral')}" title="Show neutral cards"><span class="sw" style="background:${NEU}"></span>Neutral</a><a class="li" href="${boardLink('sent','positive')}" title="Show the positive cards"><span class="sw" style="background:${POS}"></span>Positive</a></div>`,svg,bind,table};
}

/* Sparkline for category rows — single muted line, 1.5px, no axis. */
function sparkSvg(series,w,h){
  const max=Math.max(1,...series);
  const n=series.length;
  const pts=series.map((v,i)=>`${(n===1?w/2:i/(n-1)*w).toFixed(1)},${(h-2-(v/max*(h-4))).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(--faint)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></polyline></svg>`;
}

/* Categories — table-chart hybrid rows: total bar with the negative share as
   the red emphasis segment, plus a per-day sparkline. Values printed on every
   row (this IS the table channel, so full labelling is correct here). */
function categoryRows(){
  const cats=DATA.categories.filter(c=>c.total>0);
  if(!cats.length) return {rows:'<div class="empty" style="padding:22px">No categorised coverage in this window.</div>',table:()=>''};
  const max=Math.max(...cats.map(c=>c.total));
  const rows=cats.map(c=>{
    const negW=pct(c.negative,max), restW=pct(c.total-c.negative,max);
    const name=String(c.category).replace(/_/g,' ');
    return `<a class="lrow" href="${boardLink('cat',c.category)}" title="Show ${esc(name)} cards on the board">
      <span class="nm">${esc(name)}</span>
      <span class="spark">${sparkSvg(c.series,72,20)}</span>
      <span class="bar" aria-hidden="true">${c.negative?`<i style="width:${negW}%;background:${NEG}"></i>`:''}${c.total-c.negative?`<i style="width:${restW}%;background:var(--neu);opacity:.35"></i>`:''}</span>
      <span class="val"><b>${c.total}</b>${c.negative?` · <b class="neg">${c.negative} negative</b>`:''}</span>
    </a>`;
  }).join('');
  const table=()=>{
    let h='<table><thead><tr><th scope="col">Category</th><th scope="col">Items</th><th scope="col">Negative</th><th scope="col">Vodafone-negative</th></tr></thead><tbody>';
    cats.forEach(c=>{ h+=`<tr><td>${esc(String(c.category).replace(/_/g,' '))}</td><td>${c.total}</td><td>${c.negative}</td><td>${c.vodNeg}</td></tr>`; });
    return h+'</tbody></table>';
  };
  return {rows,table};
}

/* Narratives — same-theme stories grouped into named threads, sorted rising
   first. Bar length = volume vs the biggest narrative, split by sentiment; the
   sparkline is the narrative's volume over the window; the representative
   headline rides underneath as context. */
function narrativeRows(list){
  if(!list||!list.length) return {rows:`<div class="empty" style="padding:22px">No multi-story narratives in this window yet.<br>They form as several stories share a theme.</div>`,table:()=>''};
  const max=Math.max(...list.map(n=>n.total));
  const rows=list.map(n=>{
    const rise=n.rising?`<span class="badge rise">rising${(n.risingScore&&n.risingScore>=2)?` ${n.risingScore}×`:''}</span>`:'';
    const seg=(v,c,op)=>v?`<i style="width:${pct(v,max)}%;background:${c}${op?`;opacity:${op}`:''}"></i>`:'';
    const bar=seg(n.negative,NEG)+seg(n.neutral,'var(--neu)','.35')+seg(n.positive,POS);
    const sub=n.headline?`<span class="sub" dir="auto">${esc(n.headline)}</span>`:'';
    // &n= is the narrative's TRUE story count. The board compares it with the
    // ids it received and says so when it can only show a subset — the failure
    // this replaced was a board that silently listed fewer cards than this row.
    const nTotal=n.idsTotal||n.total;
    const href=n.ids&&n.ids.length?`/?ids=${n.ids.join(',')}&label=${encodeURIComponent(n.name)}&n=${nTotal}&win=${boardWin()}`:boardLink('brand',n.brand);
    return `<a class="lrow narr" href="${href}" title="${esc(n.name)} — tap to show these ${n.total} stories on the board">
      <span class="nm" dir="auto">${esc(n.name)}${rise}${sub}</span>
      <span class="spark">${sparkSvg(n.series,72,20)}</span>
      <span class="bar" aria-hidden="true">${bar}</span>
      <span class="val"><b>${n.total}</b> stor${n.total===1?'y':'ies'}</span>
    </a>`;
  }).join('');
  const table=()=>{
    let h='<table><thead><tr><th scope="col">Narrative</th><th scope="col">Brand</th><th scope="col">Stories</th><th scope="col">Negative</th><th scope="col">Neutral</th><th scope="col">Positive</th><th scope="col">Rising</th></tr></thead><tbody>';
    list.forEach(n=>{ h+=`<tr><td>${esc(n.name)}</td><td>${esc(n.brand)}</td><td>${n.total}</td><td>${n.negative}</td><td>${n.neutral}</td><td>${n.positive}</td><td>${n.rising?('▲'+(n.risingScore?' '+n.risingScore+'×':'')):'—'}</td></tr>`; });
    return h+'</tbody></table>';
  };
  return {rows,table};
}

/* Outlet / author intelligence — one row per journalist/outlet: bar length is
   VOLUME (mentions vs the busiest), split into their own negative/neutral/
   positive SENTIMENT mix; a sparkline shows their activity over the window; and
   repeat-negative behaviour is flagged. "Repeat critic" = 2+ Vodafone-negative
   stories; "leans negative" = ≥3 stories and a majority of their output scoring
   negative for whichever brand it covers — a tone signal about the writer, which
   is not the same thing as hostility to us (that is what Vod-neg is for). */
function leaderboardRows(list,kind){
  if(!list.length) return {rows:`<div class="empty" style="padding:22px">No ${kind} data in this window.</div>`,table:()=>'',pager:''};
  // Bar length is volume relative to the busiest row IN THE WHOLE LIST, not the
  // current page — otherwise page 3's quietest outlet would draw a full-width
  // bar and read as the busiest in the window.
  const max=Math.max(...list.map(o=>o.mentions));
  const pages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));
  const page=Math.min(Math.max(0,pageOf[kind]||0),pages-1);
  pageOf[kind]=page;
  const start=page*PAGE_SIZE;
  const slice=list.slice(start,start+PAGE_SIZE);
  const rows=slice.map(o=>{
    const name=kind==='outlet'?o.outlet:o.author;
    const negShare=pct(o.negative,o.mentions);
    const critic=kind==='author'&&o.vodNeg>=2;
    const leaning=o.mentions>=3&&negShare>=50;
    const flags=`${critic?`<span class="badge">repeat critic</span>`:''}${leaning?`<span class="badge lean">leans negative</span>`:''}`;
    const sub=kind==='author'&&o.outlets&&o.outlets.length?`<span class="sub">${esc(o.outlets.join(' · '))}</span>`:'';
    // Volume-scaled sentiment bar: segment widths are % of the busiest row, so
    // bar LENGTH reads as volume and the colour split reads as sentiment mix.
    const seg=(n,c,op)=>n?`<i style="width:${pct(n,max)}%;background:${c}${op?`;opacity:${op}`:''}"></i>`:'';
    const bar=seg(o.negative,NEG)+seg(o.neutral,'var(--neu)','.35')+seg(o.positive,POS);
    const spark=o.series?sparkSvg(o.series,72,20):'';
    return `<a class="lrow" href="${boardLink(kind==='outlet'?'outlet':'author',name)}" title="Show ${esc(name)}'s cards on the board">
      <span class="nm">${esc(name)}${flags}${sub}</span>
      <span class="spark">${spark}</span>
      <span class="bar" aria-hidden="true">${bar}</span>
      <span class="val" title="${o.mentions} stories · ${negShare}% of their coverage ran negative${o.vodNeg?` · ${o.vodNeg} negative about Vodafone`:''}"><b>${o.mentions}</b> · ${negShare}% negative${o.vodNeg?` · <b class="neg">${o.vodNeg} Vod-neg</b>`:''}</span>
    </a>`;
  }).join('');
  // The table view shows the SAME page as the list above it — one pager moves
  // both, so the two channels never disagree about how much is on screen.
  const table=()=>{
    let h=`<table><caption class="axis" style="text-align:left;padding:2px 0 6px;color:var(--faint)">${kind==='outlet'?'Outlets':'Journalists'} ${start+1}–${start+slice.length} of ${list.length}</caption><thead><tr><th scope="col">${kind==='outlet'?'Outlet':'Author'}</th><th scope="col">Stories</th><th scope="col">Negative</th><th scope="col">Neutral</th><th scope="col">Positive</th><th scope="col">Vod-neg</th></tr></thead><tbody>`;
    slice.forEach(o=>{ h+=`<tr><td>${esc(kind==='outlet'?o.outlet:o.author)}</td><td>${o.mentions}</td><td>${o.negative}</td><td>${o.neutral}</td><td>${o.positive}</td><td>${o.vodNeg}</td></tr>`; });
    return h+'</tbody></table>';
  };
  const noun=kind==='outlet'?'outlets':'journalists';
  const pager=pages<2?'':`<div class="pager">
    <button class="pg" type="button" data-kind="${kind}" data-to="${page-1}"${page===0?' disabled':''} aria-label="Previous page of ${noun}">‹ Prev</button>
    <span class="pgn" role="status">${start+1}–${start+slice.length} of ${list.length}</span>
    <button class="pg" type="button" data-kind="${kind}" data-to="${page+1}"${page>=pages-1?' disabled':''} aria-label="Next page of ${noun}">Next ›</button>
  </div>`;
  return {rows,table,pager};
}

   Page assembly
   ============================================================ */

/* ── "So what?" — the executive strip ─────────────────────────────────────
   Trends opened on charts. A chart answers "what does the shape look like",
   which is the second question; the first is "what changed, and who do I need
   to talk to". A PR reader was deriving that by eye from five cards every
   morning.

   Every line below is DERIVED ARITHMETIC over the same arrays the charts
   render — not a second aggregation, and emphatically not an LLM. Three rules
   it keeps, because an executive summary that overstates is worse than none:

     1. Nothing is stated without the numbers behind it. Each line carries its
        own counts, so the reader can check it against the card underneath.
     2. A comparison needs a real baseline. Half a window with no prior half,
        or a rise from zero, produces NO line rather than a percentage that
        divides by nothing.
     3. When nothing qualifies, it says so. A strip that always finds five
        things to say is a strip nobody believes by the second week. */
function execInsights(){
  const D=DATA, t=D.totals, W=boardWin(), out=[];
  const days=(D.days||[]).length;
  // Split the window in half and compare like with like. Needs at least two
  // days a side, or "up 100%" is one story against zero.
  const half=Math.floor(days/2);
  const sum=(a,from,to)=>(a||[]).slice(from,to).reduce((x,y)=>x+(y||0),0);
  const comparable=half>=2;
  const label=`vs the previous ${half} day${half===1?'':'s'}`;

  // 1. Vodafone negatives, this half against the last. The number the team
  //    actually reports upwards.
  if(comparable){
    const neg=D.sov?.Vodafone?.negatives||[];
    const now=sum(neg,half,days), before=sum(neg,0,half);
    if(now||before){
      const diff=now-before;
      const tone=diff>0?'bad':diff<0?'good':'flat';
      const word=diff>0?'up':diff<0?'down':'level';
      const pctTxt=before>0&&diff!==0?` (${diff>0?'+':''}${Math.round((diff/before)*100)}%)`:'';
      out.push({tone,
        text:`<b>Vodafone negatives ${word}</b>${pctTxt} — ${now} in the last ${half}d, ${before} ${label}`,
        href:`/?brand=Vodafone&sent=negative&win=${W}`});
    }
  }

  // 2. The competitor gaining the most share of voice. Only when there is a
  //    baseline to have gained ON — a rival appearing from nothing is news the
  //    reader can see in the chart, not a percentage.
  if(comparable){
    let best=null;
    for(const b of ['Orange','WE','e&']){
      const m=D.sov?.[b]?.mentions||[];
      const now=sum(m,half,days), before=sum(m,0,half);
      if(before<2||now<=before) continue;
      const gain=Math.round(((now-before)/before)*100);
      if(gain>=25&&(!best||gain>best.gain)) best={brand:b,gain,now,before};
    }
    if(best) out.push({tone:'flat',
      text:`<b>${esc(best.brand)} is louder</b> — ${best.now} mentions in the last ${half}d vs ${best.before} ${label} (+${best.gain}%)`,
      href:`/?brand=${encodeURIComponent(best.brand)}&win=${W}`});
  }

  // 3. Where the pressure is. Vodafone-negative by category — the one that
  //    names a team to hand it to.
  {
    const c=(D.categories||[]).filter(x=>x.vodNeg>0).sort((a,b)=>b.vodNeg-a.vodNeg)[0];
    if(c) out.push({tone:'bad',
      text:`<b>Most Vodafone criticism is ${esc(String(c.category).replace(/_/g,' '))}</b> — ${c.vodNeg} of ${t.vodafone.negatives} negative${t.vodafone.negatives===1?'':'s'}`,
      href:`/?cat=${encodeURIComponent(c.category)}&brand=Vodafone&sent=negative&win=${W}`});
  }

  // 4. Who is writing it. An outlet with a single negative is not a pattern,
  //    so this needs two.
  {
    const o=(D.outlets||[]).filter(x=>x.vodNeg>=2).sort((a,b)=>b.vodNeg-a.vodNeg)[0];
    if(o) out.push({tone:'bad',
      text:`<b>${esc(o.outlet)} leads the negative coverage</b> — ${o.vodNeg} Vodafone-negative of ${o.mentions} stor${o.mentions===1?'y':'ies'}`,
      href:`/?outlet=${encodeURIComponent(o.outlet)}&win=${W}`});
    const a=(D.authors||[]).filter(x=>x.vodNeg>=2).sort((x,y)=>y.vodNeg-x.vodNeg)[0];
    if(a) out.push({tone:'bad',
      text:`<b>${esc(a.author)} is the most critical byline</b> — ${a.vodNeg} Vodafone-negative of ${a.mentions}`,
      href:`/?author=${encodeURIComponent(a.author)}&win=${W}`});
  }

  // 5. Threads still growing. Counted from the same `rising` flag the
  //    narrative rows show, so the strip and the card cannot disagree.
  {
    const rising=(D.narratives||[]).filter(n=>n.rising);
    if(rising.length) out.push({tone:'bad',
      text:`<b>${rising.length} narrative${rising.length===1?'':'s'} still building</b> — biggest: ${esc(rising.sort((a,b)=>b.total-a.total)[0].name)}`,
      href:null});
  }
  return out;
}
function execHtml(){
  const ins=execInsights();
  if(!ins.length){
    // Deliberate: no coverage, or nothing that clears the bars above. Saying so
    // is the honest answer, and it is also information.
    return `<div class="exec"><div class="exhead">So what?</div>
      <div class="exempty">Nothing in this window clears the bar for a callout — too little coverage, or no movement worth reporting.</div></div>`;
  }
  return `<div class="exec"><div class="exhead">So what?<span class="exsub">derived from the numbers below · last ${DATA.meta.days} days</span></div>
    <ul class="exlist">${ins.slice(0,5).map(i=>{
      const body=`<span class="exdot ${i.tone}" aria-hidden="true"></span><span>${i.text}</span>`;
      return `<li class="exrow">${i.href?`<a href="${esc(i.href)}">${body}</a>`:body}</li>`;
    }).join('')}</ul></div>`;
}

/* The card subtitle states how many there ARE — the list is paged, so nothing
   is being withheld. The "top N of M" wording survives only for the case where
   the API's payload backstop actually clipped the list: a cap that changes what
   the user sees still has to be visible. */
function countOf(rows,total,noun){
  const n=(rows||[]).length;
  if(total&&total>n) return `top ${n} of ${total} ${noun}s`;
  const m=total||n;
  return `${m} ${noun}${m===1?'':'s'}`;
}
function cardHtml(id,title,sub){
  // Export lives on the CARD, not in a page-wide bar: you export the section
  // you are looking at. The three actions share a wrapper so they wrap together
  // onto a second line on a phone instead of crushing the title.
  return `<section class="cardc" id="${id}">
    <div class="chead"><span class="ct">${esc(title)}</span><span class="cs">${esc(sub)}</span>
      <span class="cacts">
        <button class="tgl" type="button" data-for="${id}" aria-pressed="false" title="Toggle table view">⊞ Table</button>
        <button class="xp" type="button" data-sec="${id}" data-fmt="xls" title="Download this section as a spreadsheet">⤓ XLS</button>
        <button class="xp" type="button" data-sec="${id}" data-fmt="pdf" title="Open this section as a print-ready page, then save as PDF">⤓ PDF</button>
      </span></div>
    <div class="clegend"></div><div class="cbody"></div><div class="tbl" role="region" aria-label="${esc(title)} — data table"></div>
  </section>`;
}

const CHARTS=[
  {id:'c-sov',   title:'Share of voice',      sub:'mentions per brand per day', build:el=>sovChart(el)},
  {id:'c-neg',   title:'Negative coverage', sub:'negative stories per brand, per day', build:el=>negChart(el)},

];

function renderCharts(){
  for(const c of CHARTS){

/* Repaint a single leaderboard card. Flipping a page must not re-run render():
   that would rebuild every chart and re-bind their tooltips, and would scroll
   the reader away from the card they were reading. */
function paintLeaderboard(kind){
  const card=$(kind==='outlet'?'#c-out':'#c-auth'); if(!card) return;
  const built=leaderboardRows(kind==='outlet'?DATA.outlets:DATA.authors,kind);

/* ── Export ───────────────────────────────────────────────────────────────
   Excel: an Excel-flavoured HTML workbook, one worksheet per section — the
     same zero-dependency trick the Reports page uses for Word. Tables only.
   PDF: a print-ready page carrying each section's CHART as its live SVG plus
     the same table, handed to the browser's own Save-as-PDF.
   Both are built in the browser from DATA, so there is no second aggregation
   that could disagree with the screen — and the leaderboards export EVERY row,
   not the page you happen to be looking at. */
function exportSections(){
  const d=DATA, out=[];
  const active=SERIES.filter(b=>d.sov&&d.sov[b]&&d.sov[b].mentions.some(v=>v>0));
  const n=v=>String(v==null?'':v);
  // 'c-kpi' is the KPI row's own id — the tiles are not a .cardc, but they are
  // a section like any other and export the same way.
  out.push({id:'c-kpi',title:'Summary',headers:['Metric','Value'],rows:[
    ['Window (days)',n(d.meta&&d.meta.days)],
    ['Generated',(()=>{try{return new Date(d.meta.generatedAt).toLocaleString('en-GB',{timeZone:'Africa/Cairo'});}catch(e){return '';}})()],
    ['Stories',n(d.totals.items)],['Negative',n(d.totals.negatives)],
    ['Neutral',n(d.totals.neutrals)],['Positive',n(d.totals.positives)],
    ['Vodafone mentions',n(d.totals.vodafone&&d.totals.vodafone.mentions)],
    ['Vodafone negative',n(d.totals.vodafone&&d.totals.vodafone.negatives)],
    ['Distinct outlets',n(d.totals.distinctOutlets)],
    ['Distinct journalists',n(d.totals.distinctAuthors)],
    ['Stories carrying a byline',n(d.totals.itemsWithByline)],
  ]});
  if(active.length){
    out.push({id:'c-sov',title:'Share of voice',headers:['Day',...active,'Total'],
      rows:d.days.map((day,i)=>[fmtDay(day),...active.map(b=>n(d.sov[b].mentions[i])),n(active.reduce((t,b)=>t+d.sov[b].mentions[i],0))])});
    out.push({id:'c-neg',title:'Negative coverage',headers:['Day',...active],
      rows:d.days.map((day,i)=>[fmtDay(day),...active.map(b=>n(d.sov[b].negatives[i]))])});
  }
  const sb=SERIES.filter(b=>d.sentimentByBrand&&d.sentimentByBrand[b]&&d.sentimentByBrand[b].total);
  if(sb.length) out.push({id:'c-sent',title:'Sentiment by brand',headers:['Brand','Negative','Neutral','Positive','Total'],
    rows:sb.map(b=>{const x=d.sentimentByBrand[b];return [b,n(x.negative),n(x.neutral),n(x.positive),n(x.total)];})});
  out.push({id:'c-narr',title:'Narratives',headers:['Narrative','Brand','Stories','Negative','Neutral','Positive','Rising'],
    rows:(d.narratives||[]).map(x=>[x.name,x.brand,n(x.total),n(x.negative),n(x.neutral),n(x.positive),x.rising?'yes':'no'])});
  out.push({id:'c-cat',title:'Categories',headers:['Category','Stories','Negative','Vodafone-negative'],
    rows:(d.categories||[]).map(c=>[String(c.category).replace(/_/g,' '),n(c.total),n(c.negative),n(c.vodNeg)])});
  out.push({id:'c-out',title:'Outlets',headers:['Outlet','Stories','Negative','Neutral','Positive','Vodafone-negative'],
    rows:(d.outlets||[]).map(o=>[o.outlet,n(o.mentions),n(o.negative),n(o.neutral),n(o.positive),n(o.vodNeg)])});
  out.push({id:'c-auth',title:'Journalists',headers:['Journalist','Outlets','Stories','Negative','Neutral','Positive','Vodafone-negative'],
    rows:(d.authors||[]).map(o=>[o.author,(o.outlets||[]).join(' · '),n(o.mentions),n(o.negative),n(o.neutral),n(o.positive),n(o.vodNeg)])});
  return out.filter(x=>x.rows.length);
}
const slug=(t)=>String(t).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const expName=(ext,title)=>`pr-radar-${title?slug(title):'trends'}-${fDays}d-${new Date().toISOString().slice(0,10)}.${ext}`;
// One card = one section. `id` is the card's DOM id, which is also what each
// section carries, so the button never has to know anything else about itself.
const sectionsFor=(id)=>id?exportSections().filter((x)=>x.id===id):exportSections();
const tableHtml=(s)=>`<table><thead><tr>${s.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${
  s.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

// Worksheet names: Excel rejects []:*?/\ and anything over 31 chars.
const sheetName=(t)=>String(t).replace(/[\[\]:*?\/\\]/g,' ').slice(0,31);
function xlsDoc(sections){
  const sheets=sections.map(s=>`<x:ExcelWorksheet><x:Name>${esc(sheetName(s.title))}</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet>`).join('');
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">
<head><meta charset="utf-8">
<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets>${sheets}</x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
<style>td,th{font-family:Calibri,Arial,sans-serif;font-size:11pt;border:1px solid #ccc} th{background:#f1f2f5;font-weight:bold}
  .t{font-size:13pt;font-weight:bold;border:none}</style>
</head><body>${sections.map((s)=>
  // Each table carries its own title row: Excel puts these on separate named
  // worksheets, but any reader that flattens them into one sheet still gets
  // labelled, separated sections instead of tables running together.
  `<table><tr><td class="t" colspan="${s.headers.length}">${esc(s.title)}</td></tr></table>${tableHtml(s)}<br>`
).join('')}</body></html>`;
}

// The chart exactly as drawn on screen — it is already an inline SVG, so there
// is nothing to rasterise and nothing to re-render differently.
function chartSvg(id){
  if(!id) return '';
  // DIRECT child only: a chart card renders its svg straight into .cbody, while
  // a list card renders rows — each carrying its own little sparkline. A loose
  // descendant match would paste one row's sparkline in as the section chart.
  const el=document.querySelector(`#${id} .cbody > svg`);
  return el?el.outerHTML:'';
}
function chartLegend(id){
  const el=id&&document.querySelector(`#${id} .clegend`);
  const h=el?el.innerHTML.trim():'';
  return h?`<div class="legend">${h}</div>`:'';
}
function printDoc(sections){

  *{box-sizing:border-box}

  .legend .li,.legend a{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:inherit}
  .legend .sw{width:9px;height:9px;border-radius:2px;flex:none}
  .legend .sw.line{height:3px;width:13px;border-radius:2px}
  table{border-collapse:collapse;width:100%;font-size:10.5px}

  @page{size:A4;margin:14mm}
  @media print{body{padding:0}}
</style></head><body>
<h1>PR Radar — Trends</h1>
<div class="sub">Vodafone Egypt · last ${fDays} days · generated ${esc(when)} (Cairo)</div>
${body}
<script>window.addEventListener('load',()=>setTimeout(()=>window.print(),250));<\/script>
</body></html>`;
}

function saveBlob(name,mime,text){
  const url=URL.createObjectURL(new Blob([text],{type:mime}));
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function exportExcel(id){
  if(!DATA||!DATA.totals.items) return;
  const secs=sectionsFor(id); if(!secs.length) return;
  saveBlob(expName('xls',id&&secs[0].title),'application/vnd.ms-excel',xlsDoc(secs));
}
function exportPdf(id){
  if(!DATA||!DATA.totals.items) return;
  const secs=sectionsFor(id); if(!secs.length) return;
  const html=printDoc(secs);
  const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  // A blocked pop-up would fail silently, so fall back to downloading the same
  // page rather than leaving the button looking broken.
  const w=window.open(url,'_blank');
  if(!w) saveBlob(expName('html',id&&secs[0].title),'text/html',html);
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

function render(){
  const c=$('#content');
  if(!DATA||!DATA.totals.items){
    c.innerHTML=`${DATA?kpiHtml():''}<div class="empty">No relevant coverage stored in the last ${fDays} days.<br>Trends build up as the daily pipeline runs.</div>`;
    return;
  }
  const cats=categoryRows();
  const narr=narrativeRows(DATA.narratives);
  c.innerHTML=kpiHtml()
    // Summary numbers, then what they MEAN, then the detail. Above the charts
    // on purpose: the first question is "what changed and who do I talk to".
    +execHtml()
    +CHARTS.map(x=>cardHtml(x.id,x.title,x.sub)).join('')
    +cardHtml('c-narr','Narratives','same-theme stories grouped · rising flagged')
    +cardHtml('c-cat','Categories','volume · trend · negative share')
    +cardHtml('c-out','Outlet intelligence',countOf(DATA.outlets,DATA.totals.distinctOutlets,'outlet')+' · sentiment split · negative-leaning flagged')
    +cardHtml('c-auth','Journalist intelligence',countOf(DATA.authors,DATA.totals.distinctAuthors,'journalist')+' · sentiment split · repeat critics flagged')
    +`<div class="footnote">Counts use the board's scope (relevant items, last ${fDays} days, Cairo days). Narratives group distinct stories that share a theme (same category + overlapping wording); outlet/author counts include every outlet that ran a story (coverage instances), so they can exceed the item count. Journalist counts are lower than story counts because much Egyptian wire and desk copy carries no individual byline${DATA.totals.itemsWithByline!=null?` — ${DATA.totals.itemsWithByline} of ${DATA.totals.items} stories in this window are signed`:''}; the rest are shown as newsroom. e&amp; marks use a validated chart-legible step of the brand teal.</div>`;
  renderCharts();
  $('#c-narr .cbody').innerHTML=`<div class="rows">${narr.rows}</div>`; $('#c-narr .tbl').innerHTML=narr.table();
  // The grouping on screen right now is the deterministic token clustering,
  // which /api/stats produces for free. The LLM regrouping is a SEPARATE
  // request so the charts never wait 12 seconds on one card — see loadNarratives.
  if(DATA.narrativesPending) markNarr('refining…');
  $('#c-cat .cbody').innerHTML=`<div class="rows">${cats.rows}</div>`; $('#c-cat .tbl').innerHTML=cats.table();
  paintLeaderboard('outlet'); paintLeaderboard('author');
  c.querySelectorAll('.xp').forEach(b=>b.onclick=()=>{
    (b.dataset.fmt==='pdf'?exportPdf:exportExcel)(b.dataset.sec);
  });
  // table-view toggles (the accessible twin of every chart)
  c.querySelectorAll('.tgl').forEach(b=>b.onclick=()=>{
    const card=$('#'+b.dataset.for); const on=b.getAttribute('aria-pressed')!=='true';
    b.setAttribute('aria-pressed',String(on)); b.textContent=on?'▦ Chart':'⊞ Table';
    card.querySelector('.tbl').classList.toggle('on',on);
    card.querySelector('.cbody').classList.toggle('off',on);
    const lg=card.querySelector('.clegend'); if(lg) lg.style.display=on?'none':'';
  });
}

function buildFilters(){
  const win=$('#winRow');
  const opts=[['7','Week'],['14','2 weeks'],['30','Month'],['60','2 months'],['90','Quarter']];
  win.innerHTML=`<span class="flabel">Window</span>`+opts.map(([v,l])=>`<button class="chip" type="button" data-v="${v}" aria-pressed="${String(fDays)===v}">${l}</button>`).join('');
  win.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
    fDays=Number(ch.dataset.v); localStorage.setItem('pr_stats_days',ch.dataset.v);
    win.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===ch.dataset.v)));
    load();
  });
}

let loading=false;
async function load(){
  if(!session){ location.href='/login'; return; }
  if(loading) return; loading=true;
  pageOf={outlet:0,author:0};   // a new window means new lists — never land on a page that no longer exists
  // refetch keeps the frame: fade the previous render, no skeleton flash
  const prev=$('#content'); if(DATA) prev.style.opacity='.45';
  try{
    const r=await afetch(`/api/stats?days=${fDays}`);
    if(r.status===401){ location.href='/login'; return; }
    if(r.status===403){ $('#content').innerHTML=`<div class="gate">Your account isn't authorised for this page.<br>Ask an admin to add you.</div>`; return; }
    DATA=await r.json();
    render();
    // Not awaited: the page is complete without it, and blocking here would
    // put the 12-second ceiling straight back on the load.
    if(DATA.narrativesPending) loadNarratives(fDays,++narrSeq);
  }catch(e){
    $('#content').innerHTML=`<div class="empty">Couldn't load trends.<br>${esc(e.message||e)}</div>`;
  }finally{ loading=false; prev.style.opacity=''; }
}

/* NARRATIVES, off the critical path.
   /api/stats used to await the LLM grouping inline, so on a cold request every
   chart on this screen waited on a 12-second ceiling for ONE card. The main
   call now returns the deterministic clustering (free, already useful) and this
   asks for the better grouping afterwards.
   Fail-soft in the strongest sense: on any error, timeout or 403 the page KEEPS
   the grouping it already drew. There is no failure state to render, because
   nothing is missing — only un-upgraded. */
let narrSeq=0;
function markNarr(text){
  const el=$('#c-narr .cs'); if(!el) return;
  el.dataset.base=el.dataset.base||el.textContent;
  el.textContent=text?`${el.dataset.base} · ${text}`:el.dataset.base;
}
async function loadNarratives(days,seq){
  try{
    const r=await afetch(`/api/stats?view=narratives&days=${days}`);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    // A window change (or a reload) started a newer request: drop this answer
    // rather than painting 30-day narratives over a 7-day board.
    if(seq!==narrSeq||!DATA) return;
    if(Array.isArray(d.narratives)&&d.narratives.length) {
      DATA.narratives=d.narratives;
      const narr=narrativeRows(DATA.narratives);
      $('#c-narr .cbody').innerHTML=`<div class="rows">${narr.rows}</div>`;
      $('#c-narr .tbl').innerHTML=narr.table();
    }
  }catch(e){ /* keep the clustering already on screen */ }
  finally{ if(seq===narrSeq) markNarr(''); }
}

let rzT=null;
addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ if(DATA&&DATA.totals.items) renderCharts(); },150); });

buildFilters();
load();
</script>
</body>
</html>
