<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PR Radar — Admin</title>
<meta name="description" content="Manage watchlist subscribers and triage board feedback.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f1f2f5">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PR Radar">
<meta property="og:title" content="PR Radar — Admin">
<meta property="og:description" content="Daily press &amp; media monitor for Vodafone Egypt — coverage, sentiment and share of voice, classified and briefed for the PR &amp; Communications team.">
<meta property="og:image" content="/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/og-card.png">
<style>
  :root{
    --red:#e60000; --red-deep:#b60009;
    --bg:#f1f2f5; --card:#ffffff; --raise:#f6f7f9;
    --ink:#16191f; --ink-2:#3b434e; --muted:#6c7480; --faint:#9aa2ad; --hair:#e7e9ee; --hair-2:#eef0f3;
    --pos:#0f9d58; --pos-bg:#edfaf1; --amber:#d97706; --neg-bg:#fff2f0; --neg-line:#ffd4cf;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --mh:56px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  a{color:var(--red)}
  .wrap{max-width:840px;margin:0 auto;min-height:100vh;padding-bottom:70px}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}

  .top{position:sticky;top:0;z-index:40;height:var(--mh);display:flex;align-items:center;gap:11px;padding:0 16px;
       background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border-bottom:1px solid var(--hair)}
  .back{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--ink);color:#fff;text-decoration:none;font-size:15px;font-weight:800}
  .ttl{flex:1;min-width:0}
  .ttl .h1{font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .ttl .sub{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:500}

  /* Seven tabs no longer fit a phone. The row scrolls WITHIN itself —
     overflow-x on the container — so the document never grows wider than the
     viewport; without this the whole page panned sideways and the content
     cards slid off-screen. flex:none on .tab stops tabs shrinking/wrapping. */
  .tabs{display:flex;gap:7px;padding:12px 16px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;cursor:pointer;border:1px solid var(--hair);background:var(--card);color:var(--ink-2);font-family:var(--sans);
       font-size:13px;font-weight:700;padding:8px 15px;border-radius:11px}
  .tab[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tab .n{font-family:var(--mono);font-size:10px;opacity:.7;margin-left:5px}

  .content{padding:14px 16px 0}
  .gate,.empty{text-align:center;color:var(--muted);padding:56px 26px;font-size:14px;line-height:1.7}
  .gate code{background:var(--card);border:1px solid var(--hair);padding:2px 8px;border-radius:6px;color:var(--ink);font-family:var(--mono)}

  .card{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 2px 12px -8px rgba(20,23,28,.18)}
  .card h2{margin:0 0 11px;font-size:13px;font-weight:800;letter-spacing:-.01em}

  .form{display:flex;flex-wrap:wrap;gap:8px}
  .form input{flex:1 1 150px;min-width:0;border:1px solid var(--hair);border-radius:10px;padding:9px 11px;font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--raise)}
  .form input:focus{outline:none;border-color:var(--faint);background:var(--card)}
  .btn{cursor:pointer;border:0;background:var(--red);color:#fff;font-family:var(--sans);font-size:13px;font-weight:700;padding:9px 15px;border-radius:10px;white-space:nowrap}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:var(--card);color:var(--ink-2);border:1px solid var(--hair)}
  .btn.ghost:hover{border-color:var(--faint)}
  .btn.sm{padding:6px 11px;font-size:12px}
  .formmsg{width:100%;font-size:11.5px;font-weight:700;margin-top:2px}
  .formmsg.ok{color:var(--pos)} .formmsg.err{color:var(--red-deep)}
  /* A checkbox inside .form must NOT inherit `.form input{flex:1 1 150px}` —
     that stretches a 16px box across the row and pushes the button off it. */
  .form .opt{flex:none;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
             color:var(--ink-2);white-space:nowrap;cursor:pointer;padding:0 2px}
  .form .opt input[type=checkbox]{flex:none;width:16px;height:16px;min-width:0;padding:0;margin:0;accent-color:var(--red)}
  /* Provisioning result: the starter password shows ONCE here, so it has to be
     readable and copyable — this is what the admin reads out or pastes. */
  .prov{width:100%;margin-top:9px;background:var(--raise);border:1px solid var(--hair);border-radius:11px;padding:11px 13px}
  .prov .pline{font-size:12.5px;line-height:1.6;color:var(--ink-2)}
  .prov .pw{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:7px 0 3px}
  .prov code{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink);
             background:var(--card);border:1px solid var(--hair);border-radius:8px;padding:5px 9px;user-select:all}
  .prov .bad{color:var(--red-deep);font-weight:700}

  /* A .row is identity + actions, and .acts is flex:none — so .who, the only
     FLEXIBLE child, absorbed every shortfall. The Users row's four controls
     need 303px of the 328px a 390px phone leaves inside the card, so the email
     got 15px against the 228px it wanted: "tame…" above a column of
     one-word-per-line meta text, and the role pill clipped away entirely
     (live, 6 Aug). Giving .who a flex BASIS makes the row BREAK instead of
     starve — when identity and actions can't share a line, .acts wraps below
     and right-aligns, keeping the toggle and ✕ where they sit on desktop.
     Width-driven, not a breakpoint, so it holds for every row type (users,
     subscribers, requests, the WhatsApp check) at every viewport: a row whose
     actions DO fit is untouched. Identity text now wraps rather than
     ellipsising — hiding half an address, or the role, is worse than two lines. */
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--hair-2)}
  .row:first-child{border-top:none}
  .row .who{flex:1 1 180px;min-width:0}
  .row .who .em{font-size:13px;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
  .row .who .nm{font-size:11.5px;color:var(--muted)}
  .cats{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .cat{font-size:10px;font-family:var(--mono);background:var(--hair-2);color:var(--ink-2);padding:2px 7px;border-radius:6px}
  .cat.all{background:var(--pos-bg);color:var(--pos)}
  .cat.wa{background:#e9f7ef;color:#0c7a43;font-family:var(--sans);font-weight:700}
  .cat.rst{background:#fff5e6;color:var(--amber);font-family:var(--sans);font-weight:700}
  /* margin-left:auto only bites once the cluster has wrapped onto its own line
     (on one line .who has already eaten the free space). It wraps INTERNALLY
     too: below ~330px the cluster alone is wider than the card, and a row that
     can't shrink widens the whole DOCUMENT — the tab-row lesson above. */
  .row .acts{flex:none;max-width:100%;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;align-items:center;margin-left:auto}
  .toggle{cursor:pointer;border:1px solid var(--hair);background:var(--card);border-radius:20px;width:42px;height:24px;position:relative;flex:none}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--faint);transition:all .15s}
  .toggle[aria-pressed=true]{background:var(--pos);border-color:var(--pos)}
  .toggle[aria-pressed=true]::after{left:20px;background:#fff}
  .x{cursor:pointer;border:1px solid var(--hair);background:var(--card);color:var(--muted);width:32px;height:30px;border-radius:9px;font-size:14px;line-height:1}
  .x:hover{border-color:var(--neg-line);color:var(--red-deep);background:var(--neg-bg)}

  /* feedback */
  .fb{padding:12px 0;border-top:1px solid var(--hair-2)}
  .fb:first-child{border-top:none}
  .fb.resolved{opacity:.55}
  .fb-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--faint)}
  .kind{font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--hair-2);color:var(--ink-2)}
  .kind.bug{background:var(--neg-bg);color:var(--red-deep)} .kind.idea{background:#fff5e6;color:var(--amber)} .kind.question{background:#e9f1fb;color:#1c5cab}
  .fb .msg{font-size:13.5px;line-height:1.5;color:var(--ink);margin:6px 0 0}
  .fb .meta{font-size:11px;color:var(--muted);margin-top:5px}
  .fb .acts{margin-top:8px}

  /* health — one colour language for the four states, used by the banner,
     the per-check spine and the pill, so a glance down the page reads. */
  .hbanner{border-radius:14px;padding:13px 15px;font-size:14px;font-weight:800;margin:12px 0;
           display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .hbanner .when{margin-left:auto;font-weight:500;font-size:11.5px;color:var(--muted)}
  .chk{background:var(--card);border:1px solid var(--hair);border-left:4px solid var(--faint);
       border-radius:12px;padding:11px 14px;margin:9px 0}
  .chk .ctop{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .chk .cname{font-weight:800;font-size:13.5px}
  .chk .pill{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
             border-radius:999px;padding:2px 8px;color:#fff}
  .chk .cdetail{font-size:13px;color:var(--ink);margin-top:5px;line-height:1.5}
  .chk .chint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.55}
  .s-ok{--st:var(--pos);--stbg:var(--pos-bg);--stline:#c3e9d1}
  .s-warn{--st:var(--amber);--stbg:#fff5e6;--stline:#f5dcb4}
  .s-crit{--st:var(--red-deep);--stbg:var(--neg-bg);--stline:var(--neg-line)}
  .s-unknown{--st:var(--muted);--stbg:var(--hair-2);--stline:var(--hair)}
  .chk.s-ok,.chk.s-warn,.chk.s-crit,.chk.s-unknown{border-left-color:var(--st)}
  .chk .pill{background:var(--st)}
  .hbanner.s-ok,.hbanner.s-warn,.hbanner.s-crit,.hbanner.s-unknown{
       background:var(--stbg);color:var(--st);border:1px solid var(--stline)}
  .alog{background:var(--card);border:1px solid var(--hair);border-radius:12px;padding:10px 13px;margin:8px 0}
  .alog .atop{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .alog .akind{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
               background:var(--hair-2);color:var(--ink-2);border-radius:999px;padding:2px 8px}
  .alog .akind.critical{background:var(--neg-bg);color:var(--red-deep)}
  .alog .at{font-weight:800;font-size:13px;flex:1;min-width:170px}
  .alog .awhen{font-size:11px;color:var(--faint);white-space:nowrap}
  .alog pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;
            font:11.5px/1.5 var(--mono);color:var(--muted)}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" id="backLink" href="/" title="Back to the board" aria-label="Back to the board">‹</a>
    <div class="ttl"><div class="h1">Admin</div><div class="sub">PR Radar by <b>Regulatory Affairs</b> · Vodafone Egypt</div></div>
  </header>
  <div class="tabs" id="tabs" hidden>
    <button class="tab" type="button" data-tab="subs" aria-pressed="true">Subscribers <span class="n" id="nSubs"></span></button>
    <button class="tab" type="button" data-tab="fb" aria-pressed="false">Feedback <span class="n" id="nFb"></span></button>
    <button class="tab" type="button" data-tab="requests" aria-pressed="false">Requests <span class="n" id="nReq"></span></button>
    <button class="tab" type="button" data-tab="users" aria-pressed="false">Users <span class="n" id="nUsers"></span></button>
    <button class="tab" type="button" data-tab="audit" aria-pressed="false">Audit <span class="n" id="nAudit"></span></button>
    <button class="tab" type="button" data-tab="health" aria-pressed="false">Health <span class="n" id="nHealth"></span></button>
    <button class="tab" type="button" data-tab="tools" aria-pressed="false">Tools</button>
  </div>
  <main class="content" id="content"><div class="gate">Loading…</div></main>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=(s)=>String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

const params=new URLSearchParams(location.search);
let session=(()=>{ try{ return JSON.parse(localStorage.getItem('pr_session')||'null'); }catch(e){ return null; } })();

let _cfg=null;
async function authConfig(){ if(_cfg) return _cfg; try{ _cfg=await (await fetch('/api/auth?view=config')).json(); }catch(e){ _cfg={}; } return _cfg; }
async function refreshSession(){
  if(!session?.refresh_token) return false;
  const c=await authConfig(); if(!c.supabaseUrl||!c.anonKey) return false;
  try{ const r=await fetch(`${c.supabaseUrl}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:c.anonKey,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});
    if(!r.ok) return false; const d=await r.json(); if(!d.access_token) return false;
    session={access_token:d.access_token,refresh_token:d.refresh_token||session.refresh_token}; try{ localStorage.setItem('pr_session',JSON.stringify(session)); }catch(e){} return true;
  }catch(e){ return false; }
}
async function afetch(path,opts={},_retried){
  const o={...opts,headers:{...(opts.headers||{})}};
  if(session) o.headers.Authorization=`Bearer ${session.access_token}`;
  const r=await fetch(path,o);
  if(r.status===401 && session && !_retried && await refreshSession()) return afetch(path,opts,true);
  return r;
}

let TAB='subs', SUBS=[], FB=[], USERS=[], AUDIT=[], REQ=[], RESETS=[], HEALTH=null;
const api=(opts)=>afetch(`/api/admin${opts.q?opts.q.replace(/^&/,'?'):''}`,{method:opts.method||'GET',headers:opts.body?{'Content-Type':'application/json'}:undefined,body:opts.body?JSON.stringify(opts.body):undefined});
// Recognisable, not a directory: country code + last four.
const maskWa=(n)=>{ const d=String(n||'').replace(/[^\d]/g,''); return d.length<=6?d:`${d.slice(0,2)}${'•'.repeat(Math.max(2,d.length-6))}${d.slice(-4)}`; };
const when=(t)=>{ try{ return new Date(t).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit',timeZone:'Africa/Cairo'}); }catch(e){ return ''; } };

/* ── Subscribers ── */
// Which row is open for editing. Only one at a time: two half-finished forms
// on screen is how you save the wrong one.
let EDITING=null;
function subEditRow(s){
  const cats=Array.isArray(s.categories)?s.categories.join(', '):'';
  return `<div class="row" data-id="${s.id}">
    <div class="who">
      <div class="form" style="gap:6px">
        <input id="eEmail" type="email" value="${esc(s.email)}" placeholder="email@vodafone.com" autocomplete="off">
        <input id="eName" type="text" value="${s.name?esc(s.name):''}" placeholder="Name (optional)" autocomplete="off">
        <input id="eCats" type="text" value="${esc(cats)}" placeholder="Categories, comma-sep (blank = all)" autocomplete="off">
        <input id="eWa" type="tel" value="${s.whatsapp?esc(s.whatsapp):''}" placeholder="WhatsApp — e.g. 201001234567 (blank = not paged)" autocomplete="off">
        <button class="btn sm" type="button" onclick="saveSub(${s.id})">Save</button>
        <button class="btn ghost sm" type="button" onclick="cancelEdit()">Cancel</button>
        <div class="formmsg" id="eMsg"></div>
      </div>
    </div>
  </div>`;
}
function subRow(s){
  if(EDITING===s.id) return subEditRow(s);
  const cats=Array.isArray(s.categories)&&s.categories.length
    ? s.categories.map(c=>`<span class="cat">${esc(c)}</span>`).join('')
    : `<span class="cat all">all categories</span>`;
  return `<div class="row" data-id="${s.id}">
    <div class="who">
      <div class="em">${esc(s.email)}</div>
      <div class="nm">${s.name?esc(s.name):'—'} · added ${when(s.created_at)}</div>
      <div class="cats">${cats}${s.whatsapp?`<span class="cat wa" title="Also paged on WhatsApp for urgent stories">✆ ${esc(maskWa(s.whatsapp))}</span>`:''}</div>
    </div>
    <div class="acts">
      <button class="x edit" type="button" title="Edit this subscriber" onclick="editSub(${s.id})">✎</button>
      <button class="toggle" type="button" aria-pressed="${!!s.active}" title="${s.active?'Active — click to pause':'Paused — click to activate'}" onclick="toggleSub(${s.id},this)"></button>
      <button class="x del" type="button" title="Remove subscriber" onclick="removeSub(${s.id})">✕</button>
    </div>
  </div>`;
}
function renderSubs(){
  const active=SUBS.filter(s=>s.active).length;
  $('#content').innerHTML=`
    <div class="card">
      <h2>Add a subscriber</h2>
      <div class="nm" style="line-height:1.6;margin:0 0 10px">The WhatsApp number is <b>optional</b> — leave it blank and the person just gets the daily brief. Enter it with the <b>country code and no +</b> (Egypt mobile <code>010 1234 5678</code> → <code>201012345678</code>): drop the leading 0 after the country code. Spaces, dashes and a leading + are cleaned up automatically. They must also <b>message the PR Radar number once</b> from their own WhatsApp before they can receive alerts.</div>
      <div class="form">
        <input id="fEmail" type="email" placeholder="email@vodafone.com" autocomplete="off">
        <input id="fName" type="text" placeholder="Name (optional)" autocomplete="off">
        <input id="fCats" type="text" placeholder="Categories, comma-sep (blank = all)" autocomplete="off">
        <input id="fWa" type="tel" placeholder="WhatsApp — country code + number, e.g. 201001234567" autocomplete="off">
        <button class="btn" id="addBtn" type="button">Add</button>
        <div class="formmsg" id="fMsg"></div>
      </div>
    </div>
    <div class="card">
      <h2>Subscribers · ${active} active / ${SUBS.length} total · ${SUBS.filter(s=>s.active&&s.whatsapp).length} on WhatsApp</h2>
      ${SUBS.length?SUBS.map(subRow).join(''):`<div class="empty">No subscribers yet.<br>Add one above — a subscriber with no categories gets the full daily brief.</div>`}
    </div>`;
  $('#addBtn').onclick=addSub;
  $('#fEmail').addEventListener('keydown',e=>{ if(e.key==='Enter') addSub(); });
}
async function addSub(){
  const email=$('#fEmail').value.trim(), name=$('#fName').value.trim(), categories=$('#fCats').value.trim();
  const whatsapp=$('#fWa').value.replace(/[^\d]/g,'');
  const msg=$('#fMsg'), btn=$('#addBtn');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg.textContent='Enter a valid email.'; msg.className='formmsg err'; return; }
  if(whatsapp && whatsapp.length<8){ msg.textContent='WhatsApp number looks too short — use country code, digits only.'; msg.className='formmsg err'; return; }
  btn.disabled=true;
  try{
    const r=await api({method:'POST',body:{email,name,categories,whatsapp}});
    if(!r.ok){ const e=await r.json().catch(()=>({})); msg.textContent=e.error||'Failed to add.'; msg.className='formmsg err'; btn.disabled=false; return; }
    msg.textContent='Added ✓'; msg.className='formmsg ok';
    await loadSubs();
  }catch(e){ msg.textContent='Network error.'; msg.className='formmsg err'; btn.disabled=false; }
}
function editSub(id){ EDITING=id; renderSubs(); }
function cancelEdit(){ EDITING=null; renderSubs(); }
async function saveSub(id){
  const msg=$('#eMsg');
  const body={
    email:$('#eEmail').value.trim(),
    name:$('#eName').value.trim(),
    categories:$('#eCats').value.trim(),
    // '' is meaningful here: it CLEARS the number. Sending undefined would
    // leave it untouched, so "I removed their WhatsApp" would silently not.
    whatsapp:$('#eWa').value.replace(/[^\d]/g,''),
  };
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(body.email)){ msg.textContent='Enter a valid email.'; msg.className='formmsg err'; return; }
  if(body.whatsapp && body.whatsapp.length<8){ msg.textContent='WhatsApp number needs the country code, digits only.'; msg.className='formmsg err'; return; }
  msg.textContent='Saving…'; msg.className='formmsg';
  try{
    const r=await api({method:'PATCH',body:{id,...body}});
    if(!r.ok){ const e=await r.json().catch(()=>({})); msg.textContent=e.error||'Failed to save.'; msg.className='formmsg err'; return; }
    EDITING=null;
    await loadSubs();
  }catch(e){ msg.textContent='Network error.'; msg.className='formmsg err'; }
}
async function toggleSub(id,btn){
  const next=btn.getAttribute('aria-pressed')!=='true';
  btn.setAttribute('aria-pressed',String(next));
  const s=SUBS.find(x=>x.id===id); if(s) s.active=next;
  try{ await api({method:'PATCH',body:{id,active:next}}); }catch(e){}
  // refresh the "N active" header count without a full reload
  const active=SUBS.filter(x=>x.active).length; const h=$('.card:last-child h2'); if(h) h.textContent=`Subscribers · ${active} active / ${SUBS.length} total`;
  $('#nSubs').textContent=SUBS.length;
}
async function removeSub(id){
  if(!confirm('Remove this subscriber?')) return;

/* ── Feedback ── */
function fbRow(f){
  return `<div class="fb ${f.resolved?'resolved':''}" data-id="${f.id}">
    <div class="fb-top">
      ${f.kind?`<span class="kind ${esc(f.kind)}">${esc(f.kind)}</span>`:'<span class="kind">note</span>'}

    </div>

    <div class="acts">
      <button class="btn ghost sm" type="button" onclick="toggleFb(${f.id},${f.resolved?'true':'false'},this)">${f.resolved?'Re-open':'Mark resolved'}</button>

  </div>`;

function renderFb(){
  const open=FB.filter(f=>!f.resolved).length;
  $('#content').innerHTML=`<div class="card">
    <h2>Feedback · ${open} open / ${FB.length} total</h2>
    ${FB.length?FB.map(fbRow).join(''):`<div class="empty">No feedback yet.<br>Messages from the board's feedback form land here.</div>`}
  </div>`;
}
async function toggleFb(id,resolved,btn){
  const next=!resolved;
  const f=FB.find(x=>x.id===id); if(f) f.resolved=next;
  btn.closest('.fb').classList.toggle('resolved',next); btn.textContent=next?'Re-open':'Mark resolved';
  btn.setAttribute('onclick',`toggleFb(${id},${next},this)`);
  const open=FB.filter(x=>!x.resolved).length; const h=$('#content h2'); if(h) h.textContent=`Feedback · ${open} open / ${FB.length} total`; $('#nFb').textContent=FB.length;
  try{ await api({method:'PATCH',q:'&resource=feedback',body:{id,resolved:next}}); }catch(e){}
}

// The result of the last add, kept so a re-render (loadUsers) doesn't wipe the
// one screen the starter password is ever shown on.
let LAST_PROV=null;
// What actually happened, step by step. A partial success must not read like a
// clean run: if the email failed, the admin is the only route the password has
// left, so it is spelled out rather than buried in a ✓.
function showProvision(d){
  const out=$('#uOut'); if(!out) return;
  const L=[];
  if(d.credentials==='created'){
    L.push(`<div class="pline"><b>${esc(d.user&&d.user.email||'')}</b> added as ${esc(d.role||'viewer')}.</div>`);
    L.push(`<div class="pw"><span class="pline">Starter password</span><code id="uPw">${esc(d.password||'')}</code>`
      +`<button class="btn ghost sm" type="button" id="uCopy">Copy</button></div>`);
  } else if(d.credentials==='existing'){
    L.push(`<div class="pline"><b>${esc(d.user&&d.user.email||'')}</b> added as ${esc(d.role||'viewer')}. They already had a password, so it was <b>left alone</b> — and no email was sent, because mailing a password they no longer use would just send them to a login that fails.</div>`);
  } else if(d.credentials==='failed'){
    L.push(`<div class="pline bad">${esc(d.user&&d.user.email||'')} is allowlisted, but no password could be set${d.credentialsError?` (${esc(d.credentialsError)})`:''}. They cannot sign in until you use <b>Reset password</b> on their row.</div>`);
  }
  if(d.emailed===true) L.push(`<div class="pline">Sign-in details emailed to them ✓${d.bccd?' — you are BCC&rsquo;d, so the copy is in your inbox too.':''}</div>`);
  else if(d.emailed===false) L.push(`<div class="pline bad">The email did NOT send${d.emailError?` — ${esc(d.emailError)}`:''}. Send them the password above yourself.</div>`);
  else if(d.credentials==='created') L.push(`<div class="pline">No email sent (you unticked it) — pass the password on yourself.</div>`);
  const SUBTEXT={added:'Added to the daily brief.',reactivated:'Their paused daily-brief subscription was switched back on.',
    already:'Already on the daily brief — their categories and WhatsApp number were left untouched.',
    skipped:'Not subscribed to the daily brief.',failed:'Could not add them to the daily brief — add them on the Subscribers tab.'};
  L.push(`<div class="pline${d.subscriber==='failed'?' bad':''}">${esc(SUBTEXT[d.subscriber]||'')}</div>`);
  out.innerHTML=L.join(''); out.hidden=false;
  const c=$('#uCopy');
  if(c) c.onclick=async()=>{ try{ await navigator.clipboard.writeText(d.password||''); c.textContent='Copied ✓'; }
    catch(e){ const n=$('#uPw'); if(n){ const r=document.createRange(); r.selectNodeContents(n); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } c.textContent='Select & copy'; } };
}
async function addUser(){
  const email=$('#uEmail').value.trim(), name=$('#uName').value.trim(), role=$('#uRole').value;
  const subscribe=!!$('#uSub')?.checked, notify=!!$('#uNotify')?.checked;
  const msg=$('#uMsg'), btn=$('#uAddBtn');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg.textContent='Enter a valid email.'; msg.className='formmsg err'; return; }
  btn.disabled=true; msg.textContent='Setting them up…'; msg.className='formmsg';
  try{
    const r=await api({method:'POST',q:'&resource=users',body:{email,name,role,subscribe,notify}});
    if(!r.ok){ const e=await r.json().catch(()=>({})); msg.textContent=e.error||'Failed to add.'; msg.className='formmsg err'; btn.disabled=false; return; }
    const d=await r.json().catch(()=>({}));
    msg.textContent=''; msg.className='formmsg';
    // A response from an older deploy (or a mock) carries no provisioning
    // fields — fall back to the plain confirmation rather than an empty panel.
    LAST_PROV=d&&d.credentials?{...d,user:d.user||{email}}:null;
    if(!LAST_PROV){ msg.textContent='Added ✓'; msg.className='formmsg ok'; }
    // Clear the identity fields — leaving them filled invites a second click
    // that re-runs the whole provision for the same person.
    $('#uEmail').value=''; $('#uName').value='';
    // The list refresh must never cost the panel: the starter password is shown
    // exactly once, and a failed reload is no reason to lose it.
    try{ await loadUsers(); }catch(err){}
    if(LAST_PROV) showProvision(LAST_PROV);
    const b=$('#uAddBtn'); if(b) b.disabled=false;
  }catch(e){ msg.textContent='Network error.'; msg.className='formmsg err'; btn.disabled=false; }
}
// RESET, not "change": a strong temporary password is GENERATED (the admin
// never has to invent one) and pre-filled — accept it as-is, or type your own.
// Shown once after applying so it can be copied and shared; the user changes
// it themselves after signing in (Account → Change password on the board).
function genTempPassword(){
  // unambiguous set (no 0/O, 1/l/I) — this gets read out over the phone
  const chars='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const buf=new Uint32Array(12); crypto.getRandomValues(buf);
  return Array.from(buf,(v)=>chars[v%chars.length]).join('');
}
async function setUserPassword(id,email){
  const gen=genTempPassword();
  const pw=prompt(`Reset the password for ${email}.\n\nA secure temporary password has been generated — press OK to use it, or type your own (min 8 characters). They can change it after signing in.`, gen);
  if(pw==null) return;
  if(pw.length<8){ alert('Password must be at least 8 characters.'); return; }
  try{
    const r=await api({method:'PATCH',q:'&resource=users',body:{id,email,password:pw}});
    if(!r.ok){ const e=await r.json().catch(()=>({})); alert(e.error||'Failed.'); return; }
    prompt(`Password reset for ${email}. Copy it now — it won't be shown again:`, pw);
    // The server clears any outstanding reset request when a password is set, so
    // refresh both queues — otherwise the row the admin just actioned sits there
    // looking unhandled and invites a second reset.
    await loadReq();
    await loadUsers();
  }catch(e){ alert('Network error.'); }
}
async function toggleRole(id,cur,email,btn){
  const next=cur==='admin'?'viewer':'admin';
  try{ const r=await api({method:'PATCH',q:'&resource=users',body:{id,role:next,email}}); if(!r.ok){ const e=await r.json().catch(()=>({})); alert(e.error||'Failed.'); return; } }catch(e){ return; }
  await loadUsers();
}
async function toggleUser(id,email,btn){
  const next=btn.getAttribute('aria-pressed')!=='true';
  try{ const r=await api({method:'PATCH',q:'&resource=users',body:{id,active:next,email}}); if(!r.ok){ const e=await r.json().catch(()=>({})); alert(e.error||'Failed.'); return; } }catch(e){ return; }
  const u=USERS.find(x=>x.id===id); if(u) u.active=next; btn.setAttribute('aria-pressed',String(next));
}
async function removeUser(id,email){
  if(!confirm('Remove this user? They will lose access immediately.')) return;
  try{ const r=await api({method:'DELETE',q:`&resource=users&id=${id}&email=${encodeURIComponent(email)}`}); if(!r.ok){ const e=await r.json().catch(()=>({})); alert(e.error||'Failed.'); return; } }catch(e){ return; }
  USERS=USERS.filter(u=>u.id!==id); $('#nUsers').textContent=USERS.length; renderUsers();
}

// A password reset asked for from the sign-in screen. Setting a password clears
// the flag server-side, so this queue empties itself — the only reason to
// Dismiss is a request you decide not to action.
function resetRow(r){
  return `<div class="row" data-id="${r.id}">
    <div class="who">
      <div class="em">${esc(r.email)} <span class="cat ${r.role==='admin'?'all':''}">${esc(r.role||'')}</span></div>

    </div>
    <div class="acts">
      <button class="btn sm" type="button" title="Generate a new password for them" onclick="setUserPassword(${r.id},'${esc(r.email)}')">Reset password</button>
      <button class="x" type="button" title="Dismiss without changing their password" onclick="dismissReset(${r.id},'${esc(r.email)}')">✕</button>
    </div>
  </div>`;
}
function renderReq(){
  $('#content').innerHTML=`
    <div class="card">
      <h2>Password resets · ${RESETS.length} waiting</h2>
      <div class="nm" style="line-height:1.6;margin:0 0 10px">Someone tapped “Forgot password?” on the sign-in screen — you also get an email each time. There is no self-service reset link on purpose: you set a new password here and pass it on, and they change it themselves afterwards from <b>Account → Change password</b>. <b>Resetting clears the request automatically.</b></div>
      ${RESETS.length?RESETS.map(resetRow).join(''):`<div class="empty">Nobody is waiting on a password.</div>`}
    </div>
    <div class="card">
      <h2>Access requests · ${REQ.length} pending</h2>
      ${REQ.length?REQ.map(reqRow).join(''):`<div class="empty">No pending requests.<br>People who ask for access on the login screen show up here to approve or reject.</div>`}
    </div>`;
}
async function dismissReset(id,email){
  if(!confirm(`Dismiss the password-reset request from ${email}?\n\nTheir password is unchanged — only the request goes away.`)) return;
  try{ const r=await api({method:'DELETE',q:`&resource=resets&id=${id}&email=${encodeURIComponent(email)}`}); if(!r.ok){ const e=await r.json().catch(()=>({})); alert(e.error||'Failed.'); return; } }catch(e){ return; }
  RESETS=RESETS.filter(x=>x.id!==id); renderReq(); loadUsers();
}
async function approveReq(id,email,role){
  try{ const r=await api({method:'PATCH',q:'&resource=requests',body:{id,email,role}}); if(!r.ok){ const e=await r.json().catch(()=>({})); alert(e.error||'Failed.'); return; } }catch(e){ return; }
  REQ=REQ.filter(x=>x.id!==id); $('#nReq').textContent=REQ.length; renderReq(); loadUsers();
}
async function rejectReq(id,email){
  if(!confirm(`Reject the access request from ${email}?`)) return;
  try{ const r=await api({method:'DELETE',q:`&resource=requests&id=${id}&email=${encodeURIComponent(email)}`}); if(!r.ok){ const e=await r.json().catch(()=>({})); alert(e.error||'Failed.'); return; } }catch(e){ return; }
  REQ=REQ.filter(x=>x.id!==id); $('#nReq').textContent=REQ.length; renderReq();
}

async function loadWhatsappStatus(){
  const el=$('#waStatus'), btn=$('#waTestBtn'); if(!el) return;
  try{
    const r=await api({q:'&view=whatsapp-status'});
    const s=await r.json().catch(()=>({}));
    if(!r.ok){ el.textContent=''; return; }
    if(s.enabled && s.hasToken && s.hasPhoneId && s.recipients>0){
      el.innerHTML=`<span style="color:var(--pos)">● Configured</span> · ${s.recipients} recipient${s.recipients===1?'':'s'} · template “${esc(s.template)}”`;
      if(btn) btn.disabled=false;
    }else{
      const miss=[]; if(!s.enabled) miss.push('WHATSAPP_ENABLED=1'); if(!s.hasToken) miss.push('WHATSAPP_TOKEN'); if(!s.hasPhoneId) miss.push('WHATSAPP_PHONE_ID'); if(!s.recipients) miss.push('WHATSAPP_TO');
      el.innerHTML=`<span style="color:var(--amber)">● Not configured</span> — set ${esc(miss.join(', '))} in the environment.`;
      if(btn) btn.disabled=true;
    }
  }catch(e){ el.textContent=''; }
}

/* ── Health ──
   "Right now" is computed live on every open — it answers whether the radar is
   working THIS MINUTE, which is the question no other surface answers: the
   board looks identical whether the classifier is screening properly or the
   account has been capped and every story is being parked out of sight.
   "Recent alerts" is the persisted history, so a problem can be reviewed days
   later instead of hunted for in an inbox. Nothing here is shown to the team. */
const HLABEL={ok:'All clear',warn:'Needs a look',crit:'Action needed',unknown:'Partly unknown'};
const HPILL={ok:'ok',warn:'warn',crit:'critical',unknown:'unknown'};
const hstate=(s)=>['ok','warn','crit','unknown'].includes(s)?s:'unknown';
const hwhen=(t)=>{ try{ return new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Africa/Cairo'}); }catch(e){ return ''; } };

function renderHealth(){
  const d=HEALTH;
  if(!d){
    $('#content').innerHTML=`<div class="card"><h2>Pipeline health</h2>
      <div class="empty">Checking every part of the pipeline…</div></div>`;
    return;
  }
  if(d.error){
    $('#content').innerHTML=`<div class="card"><h2>Pipeline health</h2>
      <div class="empty">Couldn't run the checks.<br>${esc(d.error)}</div>
      <div class="form" style="margin-top:10px"><button class="btn ghost" id="hRefresh" type="button">Try again</button></div></div>`;
    $('#hRefresh').onclick=()=>{ HEALTH=null; renderHealth(); loadHealth(); };
    return;
  }
  const st=hstate(d.status);
  const checks=(d.checks||[]).map(c=>{
    const s=hstate(c.state);
    return `<div class="chk s-${s}">
      <div class="ctop"><span class="cname">${esc(c.label)}</span><span class="pill">${esc(HPILL[s])}</span></div>
      <div class="cdetail">${esc(c.detail||'')}</div>
      ${c.hint?`<div class="chint">${esc(c.hint)}</div>`:''}
    </div>`;
  }).join('');

  let logHtml;
  if(!d.logAvailable){
    logHtml=`<div class="empty">History isn't switched on yet — apply
      <b>migrations/2026-08-02-pr-alerts.sql</b> to start keeping it.<br>
      The live checks above work either way.</div>`;
  }else if(!(d.log||[]).length){
    logHtml=`<div class="empty">No alerts in the last 14 days.</div>`;
  }else{
    logHtml=(d.log||[]).map(a=>`<div class="alog">
      <div class="atop">
        <span class="akind ${esc(a.severity||'')}">${esc(a.kind||'ops')}</span>
        <span class="at">${esc(a.title||'')}</span>
        <span class="awhen">${esc(hwhen(a.created_at))}</span>
      </div>
      ${a.detail?`<pre>${esc(a.detail)}</pre>`:''}
    </div>`).join('');
  }

  $('#content').innerHTML=`
    <div class="hbanner s-${st}">${esc(HLABEL[st]||'Unknown')}
      <span class="when">checked ${esc(hwhen(d.generatedAt))} Cairo</span></div>
    <div class="card">
      <h2>Right now</h2>
      <div id="hChecks">${checks||'<div class="empty">No checks returned.</div>'}</div>
      <div class="form" style="margin-top:12px">
        <button class="btn ghost" id="hRefresh" type="button">Re-check</button>
        <div class="formmsg" id="hMsg"></div>
      </div>
    </div>
    <div class="card">
      <h2>Recent alerts · last 14 days</h2>
      <div id="hLog">${logHtml}</div>
    </div>
    <div class="card">
      <h2>What this is</h2>
      <div class="nm" style="line-height:1.65">
        <b>Right now</b> is computed fresh every time you open this tab — it tells you whether the radar
        is healthy this minute, not whether it was yesterday. <b>Recent alerts</b> is the history of
        problems the radar raised, kept so you can look one up later instead of searching your inbox.
        A daily job emails you only when something is in <b>warn</b> or <b>action needed</b>, and stays
        quiet otherwise; the same problem won't mail you twice in a day. None of this reaches the team.
      </div>
    </div>`;
  $('#hRefresh').onclick=()=>{ const b=$('#hRefresh'); b.disabled=true; b.textContent='Checking…'; loadHealth(); };
}
async function loadHealth(){
  try{
    const r=await afetch('/api/alerts');
    if(!r.ok){
      const e=await r.json().catch(()=>({}));
      HEALTH={error:r.status===403?'Admin only.':(e.error||`HTTP ${r.status}`)};
    }else HEALTH=await r.json();
  }catch(e){ HEALTH={error:e.message||'Network error.'}; }
  // The tab badge is the headline: a problem should be visible from any tab,
  // not only once you have thought to open this one.
  const bad=(HEALTH&&HEALTH.checks||[]).filter(c=>c.state==='warn'||c.state==='crit').length;
  $('#nHealth').textContent=HEALTH&&HEALTH.error?'!':(bad||'✓');
  if(TAB==='health') renderHealth();
}

  // BOTH queues live on this tab, so both must be fetched here — a tab that
  // renders without loading sits on stale or empty data for ever.
  const [a,b]=await Promise.all([api({q:'&view=requests'}),api({q:'&view=resets'})]);
  REQ=await a.json().catch(()=>[]); if(!Array.isArray(REQ)) REQ=[];
  RESETS=await b.json().catch(()=>[]); if(!Array.isArray(RESETS)) RESETS=[];
  $('#nReq').textContent=REQ.length+RESETS.length;
  if(TAB==='requests') renderReq();
}
function selectTab(t){
  TAB=t; $('#tabs').querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===t)));
  if(t==='subs') renderSubs();
  else if(t==='fb') renderFb();
  else if(t==='requests'){ renderReq(); loadReq(); }
  else if(t==='users'){ renderUsers(); if(!USERS.length) loadUsers(); }
  else if(t==='audit'){ renderAudit(); loadAudit(); }
  // Always re-check on open: a cached verdict from ten minutes ago answers the
  // wrong question — this tab exists to say what is true right now.
  else if(t==='health'){ HEALTH=null; renderHealth(); loadHealth(); }
  else if(t==='tools') renderTools();
}

async function boot(){
  if(!session){ location.href='/login'; return; }
  try{
    const probe=await api({q:'&view=subscribers'});
    if(probe.status===401){ location.href='/login'; return; }
    if(probe.status===403){ $('#content').innerHTML=`<div class="gate">Admin only.<br>Your account can view the board but isn't an admin. Ask an admin to grant access.</div>`; return; }
    SUBS=await probe.json(); if(!Array.isArray(SUBS)) SUBS=[];
    $('#tabs').hidden=false; $('#nSubs').textContent=SUBS.length;
    $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));
    renderSubs();
    // Warm the other tabs in the background. Health is included so its badge
    // shows a problem while you are still looking at Subscribers — a health
    // page you have to remember to open is one you find out about too late.
    loadFb(); loadReq(); loadUsers(); loadAudit(); loadHealth();
  }catch(e){ $('#content').innerHTML=`<div class="gate">Couldn't load admin.<br>${esc(e.message||e)}</div>`; }
}
boot();
</script>
</body>
</html>
